# Publica la carpeta site/ en GitHub Pages (gratis, sin límite de despliegues) cada vez que cambia main.
name: Sitio en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-static.mjs', '.github/workflows/pages.yml']
  schedule:
    - cron: '23 */3 * * *'   # cada 3 horas: actualiza las páginas para Google (/g/, /p/) y el sitemap
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Páginas estáticas para buscadores
        run: node scripts/build-static.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
