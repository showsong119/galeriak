name: deals
# Bot de ofertas: corre todos los días a las 9:00 (hora CDMX) y cada vez que Claude
# deja candidatos nuevos en deals/inbox/.
on:
  schedule:
    - cron: '7 15 * * *'   # 15:07 UTC = 9:07 CDMX
  push:
    branches: [main]
    paths: ['deals/inbox/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar ofertas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://pimuwxsazuzmgwhbrzbx.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
        run: node scripts/publish-deals.mjs
      - name: Guardar registro
        run: |
          git config user.name "galeriak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A deals
          git diff --cached --quiet || git commit -m "bot: ofertas $(date -u +%F)"
          git pull --rebase --autostash origin main && git push
