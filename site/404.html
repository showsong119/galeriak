<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaleríaK</title><meta name="robots" content="noindex">
<script>
// Publicaciones o galerías nuevas que aún no tienen página estática: abrirlas en la app.
(function(){var p=location.pathname,m;
 if(m=p.match(/^\/p\/(\d+)\/?$/))location.replace('/#p-'+m[1]);
 else if(m=p.match(/^\/g\/([\w-]+)\/?$/))location.replace('/#g-'+m[1]);
 else location.replace('/');})();
</script></head>
<body style="font-family:system-ui,sans-serif;padding:40px;text-align:center"><p>Cargando GaleríaK… <a href="/">Ir al inicio</a></p></body></html>
