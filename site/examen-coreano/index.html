const EXAM_MIN=30;

function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
// Orden de opciones fijo por pregunta (siempre igual para todos)
function order(q){const idx=q.o.map((_,i)=>i);let h=hash(q.id);for(let i=idx.length-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const LEVEL_TXT={0:"Principiante",1:"Básico 1",2:"Básico 2",3:"Intermedio 1",4:"Intermedio 2",5:"Avanzado 1",6:"Avanzado 2"};
const TOPIK_TXT={0:"Aún sin nivel TOPIK",1:"Cercano a TOPIK I · nivel 1",2:"Cercano a TOPIK I · nivel 2",3:"Cercano a TOPIK II · nivel 3",4:"Cercano a TOPIK II · nivel 4",5:"Cercano a TOPIK II · nivel 5",6:"Cercano a TOPIK II · nivel 6"};

// answers: {id: índice original elegido}
function grade(answers){
  const byLv={},bySec={};let right=0;
  for(const q of QUESTIONS){
    const ok=answers[q.id]===0;
    (byLv[q.lv]??={n:0,ok:0}).n++; if(ok)byLv[q.lv].ok++;
    (bySec[q.s]??={n:0,ok:0}).n++; if(ok)bySec[q.s].ok++;
    if(ok)right++;
  }
  // Nivel = el más alto L con ≥60% en ese nivel y ≥60% acumulado de 1..L, sin saltar niveles fallados
  let level=0,cn=0,cok=0;
  for(let L=1;L<=6;L++){
    const b=byLv[L];cn+=b.n;cok+=b.ok;
    if(b.ok/b.n>=0.6&&cok/cn>=0.6)level=L;else if(b.ok/b.n<0.4)break;
  }
  return {right,total:QUESTIONS.length,level,byLv,bySec};
}

<script>
const $=s=>document.querySelector(s);
const page=$("#page");
const QS=new URLSearchParams(location.search);
const DEMO=QS.get("demo")==="ads";
const ORDER=["V","R","L"];
const SEC_TIP={R:"En lectura, lee primero la pregunta y luego busca en el texto solo la parte que la responde.",L:"En la parte auditiva sube el volumen. Cada audio se puede escuchar 2 veces: la primera para la idea general, la segunda para el detalle."};
const KEY="gk-examen-v1";
let P=QS.get("p")||"inicio";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill=t=>esc(t).replace(/\( \)/g,'<span class="blank">( &nbsp; )</span>');
const fresh=()=>({ans:{},flag:{},plays:{},ends:0,result:null,i:{V:0,R:0,L:0},last:"V"});

/* Guardado: si el navegador no deja guardar, el examen sigue en una sola página sin recargar */
let STORE=true,st;
try{localStorage.setItem(KEY+"-t","1");localStorage.removeItem(KEY+"-t")}catch(e){STORE=false}
try{st=JSON.parse(STORE&&localStorage.getItem(KEY)||"null")}catch(e){}
if(!st||!st.i)st=fresh();
function save(){if(!STORE)return;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){STORE=false}}
function go(p){
  save();if("speechSynthesis" in window)speechSynthesis.cancel();
  if(STORE){const q=new URLSearchParams();if(p!=="inicio")q.set("p",p);if(DEMO)q.set("demo","ads");const s=q.toString();location.href=location.pathname+(s?"?"+s:"");}
  else{P=p;boot();scrollTo(0,0)}
}

/* Anuncios */
function ad(name,cls=""){
  if(ADS.client&&ADS.slots[name])return `<div class="ad ${cls}"><span class="ad-label">Publicidad</span><ins class="adsbygoogle" style="display:block" data-ad-client="${esc(ADS.client)}" data-ad-slot="${esc(ADS.slots[name])}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;
  if(DEMO)return `<div class="ad demo ${cls}"><span class="ad-label">Publicidad</span><div>Anuncio · ${name}</div></div>`;
  return "";
}
if(ADS.client){const s=document.createElement("script");s.async=true;s.crossOrigin="anonymous";s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+encodeURIComponent(ADS.client);document.head.appendChild(s)}
function fillAds(){if(!ADS.client)return;document.querySelectorAll("ins.adsbygoogle:not([data-filled])").forEach(el=>{el.dataset.filled=1;try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}})}

/* Voz coreana */
let koVoice=null;
function pickVoice(){if("speechSynthesis" in window)koVoice=speechSynthesis.getVoices().find(x=>/^ko/i.test(x.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=()=>{const had=!!koVoice;pickVoice();if(!had&&koVoice&&P==="L")renderQ()}}
function speak(lines,done){
  speechSynthesis.cancel();let k=0;
  const next=()=>{if(k>=lines.length){done&&done();return}
    const [who,txt]=lines[k++].split("|");const u=new SpeechSynthesisUtterance(txt);
    u.lang="ko-KR";if(koVoice)u.voice=koVoice;u.rate=.9;u.pitch=who==="M"?.75:1.25;
    u.onend=()=>setTimeout(next,450);u.onerror=()=>next();speechSynthesis.speak(u)};
  next();
}
const scriptOf=q=>q.a.map(l=>{const[w,t]=l.split("|");return (w==="M"?"남: ":"여: ")+esc(t)}).join("\n");

/* Tiempo */
let tick=null;
const left=()=>Math.max(0,st.ends-Date.now());
const mmss=ms=>`${String(Math.floor(ms/60000)).padStart(2,"0")}:${String(Math.floor(ms%60000/1000)).padStart(2,"0")}`;
function startTimer(){
  const el=$("#timer");el.hidden=false;clearInterval(tick);
  const up=()=>{const l=left();el.textContent=mmss(l);el.classList.toggle("low",l<5*60000);const p=$("#pauseLeft");if(p)p.textContent=mmss(l);if(l<=0)finish()};
  up();tick=setInterval(up,1000);
}
function finish(){clearInterval(tick);st.result=grade(st.ans);save();go("resultado")}
const inProgress=()=>st.ends>0&&!st.result;

/* ---------- Portada ---------- */

  </section>
  ${ad("bottom")}`;

  if(resume)$("#resume").onclick=()=>go(st.last||"V");
}

/* ---------- Sección del examen ---------- */
let sec="V",askSubmit=false;
const secQs=s=>QUESTIONS.map((q,n)=>({q,n})).filter(x=>x.q.s===s);
function vSeccion(s){
  sec=s;st.last=s;save();
  const n=ORDER.indexOf(s)+1;
  document.title=`Sección ${n}: ${SECTIONS[s]} · Examen de coreano | GaleríaK`;
  $("#crumb").textContent=`Sección ${n} de 3 · ${SECTIONS[s]}`;
  page.innerHTML=`<div class="exam"><section class="sheet q" id="q"></section>
    <aside class="side"><div class="sheet card" id="omr"></div>${ad("side","tall")}</aside></div>${ad("examBottom")}`;
  startTimer();renderQ();
}
function renderQ(){
  const list=secQs(sec),k=Math.min(st.i[sec]||0,list.length-1),{q,n}=list[k];
  const ord=order(q),plays=st.plays[q.id]||0,secDone=list.filter(x=>st.ans[x.q.id]!==undefined).length;
  const last=k===list.length-1;
  $("#q").innerHTML=`
    <div class="prog" aria-label="Avance de la sección"><div style="width:${secDone/list.length*100}%"></div></div>
    <div class="qhead"><span class="qnum">${n+1}</span><span class="chip sec">${SECTIONS[q.s]}</span><span class="chip">${k+1} de ${list.length} en esta sección</span></div>
    <p class="prompt">${esc(q.p)}</p>
    ${q.t?`<div class="passage">${fill(q.t)}</div>`:""}
    ${q.a?`<div class="listen"><button class="btn" id="play" ${plays>=2||!koVoice?"disabled":""}>▶ Escuchar</button>
      <span class="left">${koVoice?`Reproducciones: ${plays}/2`:"Tu navegador no tiene voz en coreano."}</span></div>
      ${!koVoice?`<div class="script">${scriptOf(q)}</div><p class="note">Mostramos el texto del audio. Cuenta igual, pero es más fácil que en el examen real.</p>`:""}`:""}
    <div class="opts" role="radiogroup">
      ${ord.map((oi,j)=>`<label class="opt ${st.ans[q.id]===oi?"sel":""}"><input type="radio" name="o" id="o${j}" value="${oi}" ${st.ans[q.id]===oi?"checked":""}>
        <span class="bub">${j+1}</span><span class="t ${q.ko?"ko":""}">${esc(q.o[oi])}</span></label>`).join("")}
    </div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${k===0?"disabled":""}>← Anterior</button>
      <button class="btn ghost flagb" id="flag">${st.flag[q.id]?"Quitar marca":"Marcar para revisar"}</button>
      ${last?(sec==="L"?`<button class="btn red" id="endsec">Terminar prueba</button>`:`<button class="btn red" id="endsec">Terminar sección →</button>`):`<button class="btn" id="next">Siguiente →</button>`}
    </div>`;
  const done=Object.keys(st.ans).length;
  $("#omr").innerHTML=`<h3>Hoja de respuestas</h3>
    ${ORDER.map(s=>`<div style="display:flex;flex-direction:column;gap:6px"><span class="note">${SECTIONS[s]}</span><div class="grid">
      ${secQs(s).map((x,j)=>`<button class="cell ${st.ans[x.q.id]!==undefined?"done":""} ${x.n===n?"cur":""} ${st.flag[x.q.id]?"flag":""}" data-s="${s}" data-j="${j}" aria-label="Pregunta ${x.n+1}">${x.n+1}</button>`).join("")}
    </div></div>`).join("")}
    <div class="legend"><span><i class="d"></i>Respondida</span><span><i></i>Pendiente</span><span><i class="f"></i>Marcada</span></div>
    ${askSubmit?`<div class="confirm"><b>¿Entregar la prueba?</b><span>${QUESTIONS.length-done?`Te faltan ${QUESTIONS.length-done} preguntas; contarán como incorrectas.`:"Respondiste todas las preguntas."}</span>
      <div><button class="btn red" id="yes">Sí, entregar</button><button class="btn ghost" id="no">Seguir</button></div></div>`
      :`<span class="note" style="font-variant-numeric:tabular-nums">${done} de ${QUESTIONS.length} respondidas</span><button class="btn ghost" id="sub">Entregar prueba</button>`}`;
  document.querySelectorAll("input[name=o]").forEach(r=>r.onchange=()=>{st.ans[q.id]=+r.value;save();renderQ()});
  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{const s=b.dataset.s;st.i[s]=+b.dataset.j;askSubmit=false;if(s===sec){save();renderQ();scrollTo({top:0})}else go(s)});
  $("#prev").onclick=()=>{st.i[sec]=k-1;save();renderQ();scrollTo({top:0})};
  if($("#next"))$("#next").onclick=()=>{st.i[sec]=k+1;save();renderQ();scrollTo({top:0})};
  if($("#endsec"))$("#endsec").onclick=()=>{if(sec==="L"){askSubmit=true;renderQ();$("#omr").scrollIntoView({block:"center"})}else go("pausa-"+sec)};
  $("#flag").onclick=()=>{st.flag[q.id]=!st.flag[q.id];save();renderQ()};
  if($("#sub"))$("#sub").onclick=()=>{askSubmit=true;renderQ()};
  if($("#yes"))$("#yes").onclick=finish;
  if($("#no"))$("#no").onclick=()=>{askSubmit=false;renderQ()};
  if($("#play"))$("#play").onclick=()=>{st.plays[q.id]=plays+1;save();const b=$("#play");b.disabled=true;b.textContent="Reproduciendo…";speak(q.a,()=>renderQ())};
}

/* ---------- Pausa entre secciones ---------- */
function vPausa(s){
  const n=ORDER.indexOf(s),nx=ORDER[n+1],list=secQs(s),ans=list.filter(x=>st.ans[x.q.id]!==undefined).length;
  document.title=`Sección ${n+1} completada · Examen de coreano | GaleríaK`;
  $("#crumb").textContent=`Sección ${n+1} completada`;
  page.innerHTML=`<section class="sheet pause">
    <div class="eyebrow">Sección ${n+1} de 3 completada</div>
    <h1>Terminaste ${SECTIONS[s].toLowerCase()}</h1>
    <div class="track3">${ORDER.map((x,j)=>`<div class="${j<=n?"done":j===n+1?"next":""}">${j+1}. ${SECTIONS[x]}</div>`).join("")}</div>
    <p style="margin:0">Respondiste <b>${ans} de ${list.length}</b> preguntas de esta sección. Tiempo restante: <b id="pauseLeft" style="font-variant-numeric:tabular-nums">--:--</b></p>
    <div class="tip"><b>Siguiente: ${SECTIONS[nx]}</b> (${secQs(nx).length} preguntas). ${SEC_TIP[nx]}</div>
    <div class="row"><button class="btn red" id="cont">Continuar con ${SECTIONS[nx].toLowerCase()} →</button>${ans<list.length?`<button class="btn ghost" id="back">Revisar sección ${n+1}</button>`:""}</div>
  </section>${ad("pause")}`;
  startTimer();
  $("#cont").onclick=()=>go(nx);
  if($("#back"))$("#back").onclick=()=>{const j=list.findIndex(x=>st.ans[x.q.id]===undefined);st.i[s]=j<0?0:j;go(s)};
}

/* ---------- Resultado ---------- */
function vResultado(){
  const r=st.result;
  if(!r){go("inicio");return}
  $("#timer").hidden=true;
  document.title=`Mi nivel de coreano: ${r.level} de 6 · GaleríaK`;
  $("#crumb").textContent="Resultado";
  const pct=k=>Math.round(r.bySec[k].ok/r.bySec[k].n*100);
  const weak=ORDER.slice().sort((a,b)=>pct(a)-pct(b))[0];
  const tips={V:"Repasa terminaciones y partículas del nivel siguiente con frases cortas de ejemplo.",R:"Lee textos breves cada día (avisos, mensajes, noticias fáciles) y busca primero la idea principal.",L:"Escucha diálogos cortos: primero sin texto, luego con texto, y repite en voz alta."};
  const items=QUESTIONS.map((q,n)=>({q,n,ok:st.ans[q.id]===0,mine:st.ans[q.id]}));
  const sorted=[...items.filter(x=>!x.ok),...items.filter(x=>x.ok)];
  const amz=k=>"https://www.amazon.com.mx/s?k="+encodeURIComponent(k)+(AMAZON_TAG?"&tag="+encodeURIComponent(AMAZON_TAG):"");
  const books=r.level<=2?[["Libros de coreano para principiantes","libro coreano principiantes"],["Libros de preparación TOPIK I","libro TOPIK I"]]:[["Libros de preparación TOPIK II","libro TOPIK II"],["Gramática coreana intermedia","korean grammar in use intermediate"]];
  const rv=({q,n,ok,mine})=>`<div class="rv ${ok?"ok":"bad"}">
    <div class="h"><span class="tag ${ok?"ok":"bad"}">${ok?"Correcta":(mine===undefined?"Sin responder":"Incorrecta")}</span><span>Pregunta ${n+1} · ${SECTIONS[q.s]} · Nivel ${q.lv}</span></div>
    ${q.t?`<div class="ko" style="font-size:16px">${fill(q.t.length>90?q.t.slice(0,90)+"…":q.t)}</div>`:`<div class="script">${scriptOf(q)}</div>`}
    <p><b>Respuesta:</b> <span class="${q.ko?"ko":""}">${esc(q.o[0])}</span>${!ok&&mine!==undefined?` · <span style="color:var(--bad)">Tu respuesta: <span class="${q.ko?"ko":""}">${esc(q.o[mine])}</span></span>`:""}</p>
    <p class="note">${esc(q.e)}</p></div>`;
  page.innerHTML=`
  <div class="res-top">
    <section class="sheet big">
      <div class="eyebrow">Tu nivel estimado</div>
      <div class="n">${r.level}<small> / 6</small></div>
      <h2>${LEVEL_TXT[r.level]}</h2>
      <span class="note">${TOPIK_TXT[r.level]}</span>
      <div class="scale">${[1,2,3,4,5,6].map(l=>`<div class="${l<=r.level?"on":""}"></div>`).join("")}</div>
      <span class="note" style="font-variant-numeric:tabular-nums">${r.right} de ${r.total} correctas</span>
      <div class="row"><button class="btn red" id="share">Compartir mi resultado</button><span class="toast" id="toast" role="status"></span></div>
    </section>
    <section class="sheet secs">
      <div class="eyebrow n">Resultado por sección</div>
      ${ORDER.map(k=>`<div class="srow"><span>${SECTIONS[k]}</span><div class="trk"><div style="width:${pct(k)}%"></div></div><b>${pct(k)}%</b></div>`).join("")}
      <div style="overflow-x:auto"><table class="lvtable"><tr><th>Nivel de pregunta</th>${[1,2,3,4,5,6].map(l=>`<th>${l}</th>`).join("")}</tr>
        <tr><td>Correctas</td>${[1,2,3,4,5,6].map(l=>`<td>${r.byLv[l].ok}/${r.byLv[l].n}</td>`).join("")}</tr></table></div>
    </section>
  </div>
  ${ad("result")}
  <div class="two">
    <section class="sheet box">
      <div class="eyebrow n">Qué repasar</div>
      <ul>
        <li><b>${SECTIONS[weak]}</b> es tu sección más baja (${pct(weak)}%). ${tips[weak]}</li>
        <li>${r.level<6?`Para subir al nivel ${r.level+1}, revisa abajo las preguntas de nivel ${r.level+1} que fallaste.`:"Dominas todos los niveles de esta prueba. El siguiente paso es practicar con exámenes TOPIK II completos."}</li>
      </ul>
      <div class="row"><button class="btn" id="again">Hacer la prueba otra vez</button><a class="btn ghost" href="/#g-coreano">Galería Aprender coreano</a></div>
    </section>
    <section class="sheet box">
      <div class="eyebrow n">Material para tu nivel</div>
      <ul>${books.map(([t,k])=>`<li><a href="${amz(k)}" target="_blank" rel="${AMAZON_TAG?"sponsored nofollow ":""}noopener">${t} en Amazon México</a></li>`).join("")}</ul>
      ${AMAZON_TAG?`<p class="note">Enlaces de afiliado: si compras, GaleríaK puede recibir una comisión sin costo extra para ti.</p>`:`<p class="note">Búsquedas en Amazon México. Revisa reseñas y vendedor antes de comprar.</p>`}
    </section>
  </div>
  <section class="sheet review">
    <div class="eyebrow n">Revisión con explicaciones · primero las incorrectas</div>
    ${sorted.map((x,j)=>rv(x)+((j+1)%10===0&&j<sorted.length-1?ad("review"):"")).join("")}
  </section>
  ${ad("resultBottom")}`;
  $("#again").onclick=()=>{st=fresh();save();go("inicio")};
  $("#share").onclick=async()=>{
    const url=location.origin+location.pathname,text=`Saqué nivel ${r.level} de 6 en la prueba de coreano gratis de GaleríaK. ¿Y tú?`;
    try{if(navigator.share){await navigator.share({title:"Prueba de nivel de coreano",text,url});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(text+" "+url);$("#toast").textContent="Enlace copiado"}catch(e){$("#toast").textContent=url}
  };
}

function boot(){
  clearInterval(tick);$("#timer").hidden=true;askSubmit=false;
  if(inProgress()&&left()<=0){st.result=grade(st.ans);save();if(STORE&&P!=="resultado"){go("resultado");return}P="resultado"}
  if(ORDER.includes(P)){if(!inProgress()){P="inicio";vInicio()}else vSeccion(P)}
  else if(/^pausa-[VR]$/.test(P)){if(!inProgress())vInicio();else vPausa(P.slice(6))}
  else if(P==="resultado")vResultado();
  else vInicio();
  fillAds();
}
boot();
</script>
</body>
</html>
