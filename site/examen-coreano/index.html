{id:"v4b",s:"V",lv:4,p:"Elige la palabra correcta.",t:"이 일은 시간이 많이 걸리니까 ( ) 말고 천천히 하세요.",o:["서두르지","기다리지","미루지","고민하지"],ko:1,e:"서두르다 = apresurarse. «No te apresures, hazlo con calma»."},
{id:"v5a",s:"V",lv:5,p:"Elige la terminación correcta.",t:"그 사람은 돈이 많( ) 검소하게 산다.",o:["으면서도","아서","으니까","다면"],ko:1,e:"-(으)면서도 = «aunque / a pesar de que». Aunque tiene mucho dinero, vive de forma austera."},
{id:"v5b",s:"V",lv:5,p:"Elige la palabra correcta.",t:"정부는 환경 오염을 줄이기 위해 새로운 정책을 ( ).",o:["도입했다","수입했다","입학했다","입력했다"],ko:1,e:"정책을 도입하다 = introducir/implementar una política. 수입 = importación, 입학 = ingreso escolar, 입력 = introducir datos."},
{id:"v6a",s:"V",lv:6,p:"¿Qué significa la expresión subrayada?",t:"이미 결과가 나왔으니 후회해도 소용없어. 엎질러진 물이야.",o:["Lo hecho, hecho está; ya no se puede deshacer","Hay que limpiar el agua derramada","Todavía hay tiempo para cambiarlo","El resultado fue mejor de lo esperado"],ko:0,e:"엎질러진 물 (agua derramada) = algo que ya no tiene remedio."},
{id:"v6b",s:"V",lv:6,p:"Elige la palabra correcta.",t:"그렇게 무리했으니 병이 날 ( )도 하다.",o:["법","만","수","뿐"],ko:1,e:"-(으)ㄹ 법도 하다 = «es lógico / es natural que…». Con tanto esfuerzo, es natural enfermarse."},
// --- Lectura ---
{id:"r1",s:"R",lv:1,p:"Lee y responde: ¿Dónde vive María?",t:"저는 마리아예요. 멕시코 사람이에요.\n지금 서울에 살아요. 한국어를 공부해요.",o:["En Seúl","En México","En Busan","En Madrid"],ko:0,e:"지금 서울에 살아요 = Ahora vivo en Seúl."},
{id:"r2",s:"R",lv:2,p:"Lee el aviso. ¿Qué es correcto?",t:"〈도서관 이용 시간〉\n월요일~금요일 09:00~18:00\n토요일 10:00~13:00\n일요일 휴관",o:["El sábado cierra a la 1 de la tarde","Abre los domingos","De lunes a viernes abre a las 10","El sábado cierra a las 6 de la tarde"],ko:0,e:"토요일 10:00~13:00: el sábado cierra a las 13:00. 휴관 = cerrado."},
{id:"r3a",s:"R",lv:3,p:"¿Por qué va a comer bulgogi esta persona?",t:"다음 주 금요일에 반 친구들과 같이 한국 식당에 가기로 했습니다. 저는 매운 음식을 못 먹어서 불고기를 먹을 거예요.",o:["Porque no puede comer picante","Porque es barato","Porque es su cumpleaños","Porque su amigo lo recomendó"],ko:0,e:"매운 음식을 못 먹어서 = como no puede comer comida picante."},
{id:"r3b",s:"R",lv:3,p:"Lee el mensaje. ¿Qué cambió?",t:"민수 씨, 오늘 회의가 3시에서 4시로 바뀌었어요. 장소는 그대로 2층 회의실이에요.",o:["La hora de la reunión","El lugar de la reunión","La hora y el lugar","Se canceló la reunión"],ko:0,e:"3시에서 4시로 바뀌었어요 = cambió de las 3 a las 4. 장소는 그대로 = el lugar sigue igual."},
{id:"r4a",s:"R",lv:4,p:"¿Cuál es la idea principal?",t:"요즘 혼자 밥을 먹는 사람이 늘고 있다. 바쁜 생활 때문에 다른 사람과 시간을 맞추기 어렵고, 혼자 먹는 것이 더 편하다고 생각하는 사람도 많다. 그래서 1인용 메뉴를 파는 식당도 많아졌다.",o:["Cada vez más gente come sola y los restaurantes se adaptan","Comer solo es malo para la salud","Muchos restaurantes están cerrando","La gente cocina más en casa"],ko:0,e:"El texto describe el aumento de quienes comen solos y la aparición de menús individuales (1인용 메뉴)."},
{id:"r4b",s:"R",lv:4,p:"Elige lo que va en el espacio.",t:"운동은 건강에 좋지만 갑자기 너무 많이 하면 오히려 ( ). 그러므로 처음에는 가볍게 시작하는 것이 좋다.",o:["몸에 무리가 갈 수 있다","살이 빠질 수 있다","기분이 좋아진다","시간이 절약된다"],ko:1,e:"오히려 (al contrario) + 그러므로 가볍게 시작 → algo negativo: puede sobrecargar el cuerpo."},
{id:"r5a",s:"R",lv:5,p:"¿Qué es correcto según el texto?",t:"전통 시장은 대형 마트에 비해 가격이 저렴하고 상인과 직접 이야기를 나눌 수 있다는 장점이 있다. 그러나 주차 공간이 부족하고 카드 결제가 불편한 곳이 많아 젊은 층의 발길이 줄고 있다. 최근 일부 시장은 주차장을 새로 만들고 온라인 주문 서비스를 시작하는 등 변화를 시도하고 있다.",o:["Algunos mercados intentan cambiar para atraer clientes","Los mercados tradicionales son más caros que los supermercados","Los jóvenes prefieren los mercados tradicionales","Todos los mercados aceptan tarjeta sin problema"],ko:0,e:"일부 시장은 … 변화를 시도하고 있다 = algunos mercados están intentando cambiar."},
{id:"r5b",s:"R",lv:5,p:"¿Cuál es la actitud del autor?",t:"인공지능이 사람의 일자리를 빼앗을 것이라는 걱정이 많다. 하지만 역사를 돌아보면 새로운 기술은 사라지는 직업만큼 새로운 직업도 만들어 왔다. 중요한 것은 기술을 막는 것이 아니라 변화에 맞춰 배우는 능력을 키우는 것이다.",o:["Propone adaptarse desarrollando la capacidad de aprender","Pide prohibir la inteligencia artificial","Cree que no habrá ningún cambio en el empleo","Está seguro de que todos perderán su trabajo"],ko:0,e:"중요한 것은 … 배우는 능력을 키우는 것 = lo importante es fortalecer la capacidad de aprender."},
{id:"r6a",s:"R",lv:6,p:"¿Cuál es la idea principal?",t:"언어는 단순한 의사소통의 도구에 그치지 않는다. 한 언어에 담긴 어휘와 표현에는 그 언어를 사용하는 공동체의 가치관과 세계관이 반영되어 있다. 예컨대 한국어에 발달한 높임법은 관계와 위계를 중시해 온 사회적 맥락과 무관하지 않다.",o:["Una lengua refleja los valores y la visión del mundo de su comunidad","El coreano es difícil por sus honoríficos","La única función de la lengua es comunicar","Los honoríficos coreanos están desapareciendo"],ko:0,e:"공동체의 가치관과 세계관이 반영되어 있다 = se reflejan los valores y la cosmovisión de la comunidad; los honoríficos son el ejemplo."},
{id:"r6b",s:"R",lv:6,p:"Elige lo que va en el espacio.",t:"과거에는 정보를 얻는 것 자체가 어려웠기 때문에 많이 아는 사람이 곧 경쟁력을 가졌다. 그러나 정보가 넘쳐나는 오늘날에는 ( ) 능력이 더욱 중요해졌다.",o:["필요한 정보를 가려내고 판단하는","정보를 많이 외우는","정보를 빠르게 입력하는","정보를 다른 사람에게 숨기는"],ko:1,e:"그러나 + 정보가 넘쳐나는 (exceso de información) → lo valioso ahora es seleccionar y juzgar la información."},
// --- Comprensión auditiva (voz coreana del navegador) ---
{id:"l1a",s:"L",lv:1,p:"Escucha. ¿Qué está haciendo esta persona?",a:["M|안녕하세요. 저는 김민준입니다. 만나서 반갑습니다."],o:["Se está presentando","Se está despidiendo","Está pidiendo comida","Está preguntando la hora"],ko:0,e:"저는 김민준입니다, 만나서 반갑습니다 = me llamo Kim Min-jun, mucho gusto."},
{id:"l1b",s:"L",lv:1,p:"Escucha. ¿Cuánto cuesta la bolsa?",a:["F|이 가방은 삼만 오천 원이에요."],o:["35,000 wones","30,500 wones","53,000 wones","3,500 wones"],ko:0,e:"삼만 (30,000) + 오천 (5,000) = 35,000 wones."},
{id:"l2a",s:"L",lv:2,p:"Escucha. ¿Dónde está el baño?",a:["F|실례지만 화장실이 어디에 있어요?","M|저기 엘리베이터 옆에 있어요."],o:["Junto al elevador","En el segundo piso","Afuera del edificio","Junto a la entrada"],ko:0,e:"엘리베이터 옆 = al lado del elevador."},
{id:"l2b",s:"L",lv:2,p:"Escucha. ¿Qué propone la mujer?",a:["M|내일 같이 영화 볼까요?","F|미안해요. 내일은 아르바이트가 있어요. 토요일은 어때요?"],o:["Ver la película el sábado","Ir al cine mañana","No ver la película","Trabajar juntos mañana"],ko:0,e:"토요일은 어때요? = ¿Qué tal el sábado?"},
{id:"l3",s:"L",lv:3,p:"Escucha. ¿Qué quiere el hombre?",a:["F|손님, 이 바지 어떠세요?","M|좀 작은 것 같아요. 한 치수 큰 걸로 주세요."],o:["Una talla más grande","Otro color","Un descuento","Devolver el pantalón"],ko:0,e:"한 치수 큰 걸로 = una talla más grande."},
{id:"l4",s:"L",lv:4,p:"Escucha el aviso. ¿Qué deben hacer quienes querían bajar en esta estación?",a:["F|승객 여러분께 안내 말씀드립니다. 이번 역은 공사 관계로 열차가 정차하지 않습니다. 다음 역에서 내리셔서 반대 방향 열차를 이용해 주시기 바랍니다."],o:["Bajar en la siguiente y tomar el tren en sentido contrario","Bajar de inmediato","Quedarse en el tren hasta la terminal","Tomar un autobús en esta estación"],ko:0,e:"다음 역에서 내리셔서 반대 방향 열차를 이용 = bajar en la siguiente estación y usar el tren en dirección contraria."},
{id:"l5",s:"L",lv:5,p:"Escucha. ¿Cuál es la opinión de la mujer?",a:["M|요즘 재택근무를 하는 회사가 많아졌는데, 어떻게 생각하세요?","F|출퇴근 시간이 줄어서 좋긴 하지만, 동료들과 소통하기가 어렵다는 단점도 있어요. 그래서 일주일에 두세 번은 사무실에 나가는 방식이 가장 현실적이라고 봐요."],o:["Lo más realista es combinar casa y oficina","Es mejor trabajar solo desde casa","Es mejor ir a la oficina todos los días","Le da igual dónde trabajar"],ko:0,e:"일주일에 두세 번은 사무실에 나가는 방식이 가장 현실적 = ir a la oficina 2 o 3 veces por semana es lo más realista."},
{id:"l6",s:"L",lv:6,p:"Escucha. ¿Cuál es la idea central?",a:["M|흔히 기억은 저장된 정보를 그대로 꺼내는 것이라고 생각합니다. 하지만 연구에 따르면 우리는 기억을 떠올릴 때마다 그것을 새롭게 재구성합니다. 그래서 같은 사건에 대한 기억도 시간이 지나면서 조금씩 달라질 수 있습니다."],o:["Al recordar reconstruimos el recuerdo, por eso cambia con el tiempo","La memoria guarda una copia exacta de lo vivido","Con el tiempo olvidamos todo lo que vivimos","Solo recordamos los hechos emocionales"],ko:0,e:"떠올릴 때마다 새롭게 재구성합니다 = cada vez que recordamos, lo reconstruimos."},
// --- Banco ampliado: vocabulario y gramática ---
{id:"v1c",s:"V",lv:1,p:"Elige la palabra correcta para el espacio.",t:"목이 말라요. 물을 ( ).",o:["마셔요","먹어요","봐요","써요"],ko:1,e:"El agua (물) se bebe: 마셔요. 목이 마르다 = tener sed."},
{id:"v1d",s:"V",lv:1,p:"Elige la palabra correcta para el espacio.",t:"저는 매일 아침 7시에 ( ).",o:["일어나요","앉아요","열어요","닫아요"],ko:1,e:"일어나다 = levantarse. Me levanto todos los días a las 7."},
{id:"v1e",s:"V",lv:1,p:"Elige la palabra correcta para el espacio.",t:"오늘은 날씨가 아주 ( ).",o:["좋아요","먹어요","가요","읽어요"],ko:1,e:"El clima (날씨) se describe con un adjetivo: 좋아요 = está bueno/agradable."},
{id:"v1f",s:"V",lv:1,p:"Elige la partícula correcta.",t:"친구( ) 같이 영화를 봐요.",o:["하고","에서","을","에"],ko:1,e:"하고 = «con». 친구하고 같이 = junto con un amigo."},
{id:"v2c",s:"V",lv:2,p:"Elige la forma correcta.",t:"내일 친구를 ( ) 거예요.",o:["만날","만난","만나서","만나고"],ko:1,e:"-(으)ㄹ 거예요 expresa futuro: 만날 거예요 = voy a ver (a mi amigo) mañana."},
{id:"v2d",s:"V",lv:2,p:"Elige la forma correcta.",t:"배가 고파서 밥을 많이 ( ).",o:["먹었어요","잤어요","씻었어요","불렀어요"],ko:1,e:"배가 고프다 = tener hambre; por eso comió mucho: 먹었어요."},
{id:"v2e",s:"V",lv:2,p:"Elige la terminación correcta.",t:"주말에 영화를 보( ) 싶어요.",o:["고","서","면","지"],ko:1,e:"-고 싶다 = querer hacer algo. 보고 싶어요 = quiero ver."},
{id:"v2f",s:"V",lv:2,p:"Elige la partícula correcta.",t:"저는 지하철( ) 회사에 가요.",o:["로","를","이","와"],ko:1,e:"(으)로 marca el medio de transporte: 지하철로 = en metro."},
{id:"v3c",s:"V",lv:3,p:"Elige la terminación correcta.",t:"비가 오( ) 우산을 가져가세요.",o:["니까","는데도","려고","다가"],ko:1,e:"-(으)니까 da una razón antes de un consejo u orden: como llueve, lleva paraguas."},
{id:"v3d",s:"V",lv:3,p:"Elige la partícula correcta.",t:"한국에 온 지 1년( ) 됐어요.",o:["이","을","에서","로"],ko:1,e:"-(으)ㄴ 지 … 이/가 되다 = ha pasado (tiempo) desde… 1년이 됐어요."},
{id:"v3e",s:"V",lv:3,p:"Elige la terminación correcta.",t:"책을 읽( ) 잠이 들었어요.",o:["다가","으려면","으러","도록"],ko:1,e:"-다가 = una acción se interrumpe por otra: estaba leyendo y me quedé dormido."},
{id:"v3f",s:"V",lv:3,p:"Elige la palabra correcta.",t:"시험이 끝나서 마음이 아주 ( ).",o:["홀가분해요","복잡해요","부족해요","시끄러워요"],ko:1,e:"홀가분하다 = sentirse aliviado/ligero, como al terminar un examen."},
{id:"v4c",s:"V",lv:4,p:"Elige la expresión correcta.",t:"이 식당은 음식이 맛있( ) 값도 싸요.",o:["을 뿐만 아니라","는 대신에","기는커녕","을까 봐"],ko:1,e:"-(으)ㄹ 뿐만 아니라 = no solo… sino también. No solo es rica la comida, también es barata."},
{id:"v4d",s:"V",lv:4,p:"Elige la expresión correcta.",t:"약속에 늦( ) 택시를 탔어요.",o:["을까 봐","더라도","을수록","던"],ko:1,e:"-(으)ㄹ까 봐 = por miedo a que… Tomé un taxi por miedo a llegar tarde."},
{id:"v4e",s:"V",lv:4,p:"Elige la palabra correcta.",t:"사장님이 바쁘셔서 회의를 다음 주로 ( ).",o:["미뤘어요","줄였어요","늘었어요","모였어요"],ko:1,e:"미루다 = posponer. Pospusieron la reunión a la próxima semana."},
{id:"v4f",s:"V",lv:4,p:"Elige la palabra correcta.",t:"건강을 위해 담배를 ( ).",o:["끊었어요","잘랐어요","닫았어요","껐어요"],ko:1,e:"담배를 끊다 = dejar de fumar. 끊다 también se usa con alcohol o hábitos."},
{id:"v5c",s:"V",lv:5,p:"Elige la expresión correcta.",t:"너무 피곤해서 옷을 입( ) 잠이 들었다.",o:["은 채로","는 김에","을 겸","는 셈으로"],ko:1,e:"-(으)ㄴ 채로 = en el estado de… Se durmió con la ropa puesta."},
{id:"v5d",s:"V",lv:5,p:"Elige la expresión correcta.",t:"시장에 가( ) 과일도 좀 사 오세요.",o:["는 김에","는 바람에","은 채로","을수록"],ko:1,e:"-는 김에 = aprovechando que… Ya que vas al mercado, trae también fruta."},
{id:"v5e",s:"V",lv:5,p:"Elige la palabra correcta.",t:"여러분의 다양한 의견을 ( ) 최종 결정을 내리겠습니다.",o:["수렴해서","소비해서","수술해서","출발해서"],ko:1,e:"의견을 수렴하다 = reunir y considerar opiniones."},
{id:"v5f",s:"V",lv:5,p:"Elige la palabra correcta.",t:"경기가 나빠지면서 실업률이 크게 ( ).",o:["증가했다","증명했다","증정했다","증축했다"],ko:1,e:"증가하다 = aumentar. 증명 = demostrar, 증정 = obsequiar, 증축 = ampliar un edificio."},
{id:"v6c",s:"V",lv:6,p:"¿Qué significa la expresión subrayada?",t:"그 사람은 발이 넓어서 모르는 사람이 없다.",o:["Conoce a mucha gente","Tiene los pies grandes","Camina mucho todos los días","Viaja por todo el país"],ko:0,e:"발이 넓다 (tener los pies anchos) = tener muchos contactos, conocer a mucha gente."},
{id:"v6d",s:"V",lv:6,p:"Elige la expresión correcta.",t:"꾸준히 준비하면 좋은 결과가 나오( ).",o:["기 마련이다","기 일쑤이다","ㄹ 리가 없다","는 둥 마는 둥 한다"],ko:1,e:"-기 마련이다 = es natural / suele ocurrir que… Si te preparas con constancia, es natural obtener buenos resultados."},
{id:"v6e",s:"V",lv:6,p:"¿Qué significa la expresión subrayada?",t:"시험이 코앞인데 아직 공부를 하나도 못 했어.",o:["El examen está muy cerca","El examen fue muy fácil","Olvidó la fecha del examen","El examen se canceló"],ko:0,e:"코앞 (frente a la nariz) = algo que está a punto de llegar."},
{id:"v6f",s:"V",lv:6,p:"¿Qué significa la oración?",t:"그는 사과는커녕 오히려 화를 냈다.",o:["No solo no se disculpó, sino que se enojó","Se disculpó y después se enojó","Se disculpó porque estaba enojado","Se enojó antes de disculparse"],ko:0,e:"-는커녕 = lejos de… (no ocurrió lo esperado y pasó lo contrario)."},
// --- Banco ampliado: lectura ---
{id:"r1b",s:"R",lv:1,p:"Lee y responde: ¿Qué hace hoy esta persona?",t:"오늘은 토요일이에요. 저는 친구하고 공원에 가요.\n공원에서 자전거를 타요.",o:["Anda en bicicleta en el parque con un amigo","Estudia en la biblioteca","Trabaja todo el día","Va de compras al mercado"],ko:0,e:"공원에서 자전거를 타요 = anda en bicicleta en el parque."},
{id:"r1c",s:"R",lv:1,p:"Lee y responde: ¿Cuántas personas hay en su familia?",t:"제 가족은 네 명이에요.\n아버지, 어머니, 언니, 그리고 저예요.",o:["Cuatro","Tres","Cinco","Dos"],ko:0,e:"네 명 = cuatro personas: papá, mamá, hermana mayor y yo."},
{id:"r2b",s:"R",lv:2,p:"Lee el aviso. ¿Qué es correcto?",t:"〈수영장 안내〉\n이용 시간: 06:00~21:00\n매주 월요일은 쉽니다.\n수영 모자를 꼭 쓰세요.",o:["Hay que usar gorro de natación","Abre todos los lunes","Cierra a las 6 de la tarde","Se puede nadar sin gorro"],ko:0,e:"수영 모자를 꼭 쓰세요 = use siempre gorro de natación. 월요일은 쉽니다 = cerrado los lunes."},
{id:"r2c",s:"R",lv:2,p:"Lee el mensaje. ¿Por qué llegará tarde?",t:"지수 씨, 저 지금 버스 안이에요. 길이 막혀서 20분쯤 늦을 것 같아요. 먼저 식당에 들어가 계세요.",o:["Porque hay tráfico","Porque perdió el autobús","Porque está enfermo","Porque olvidó la cita"],ko:0,e:"길이 막혀서 = como hay tráfico (el camino está congestionado)."},
{id:"r3c",s:"R",lv:3,p:"¿Qué es correcto según el texto?",t:"저는 지난달부터 요리 학원에 다니고 있어요. 처음에는 칼질도 잘 못했는데 지금은 간단한 한국 음식을 만들 수 있어요. 다음 달에는 친구들을 초대해서 직접 만든 음식을 대접하려고 해요.",o:["Planea invitar a sus amigos el próximo mes","Ya cocinaba bien desde el principio","Trabaja como maestro de cocina","Empezó a estudiar cocina hace un año"],ko:0,e:"다음 달에는 친구들을 초대해서 … 대접하려고 해요 = el próximo mes piensa invitar a sus amigos."},
{id:"r3d",s:"R",lv:3,p:"Lee el aviso. ¿Qué perdió esta persona?",t:"〈분실물을 찾습니다〉\n어제 오후 3시쯤 학생 식당에서 검은색 지갑을 잃어버렸습니다. 안에 학생증이 있습니다. 찾으신 분은 학생회실로 가져다 주세요.",o:["Una cartera negra con su credencial","Un celular negro","Una mochila con libros","Su credencial y su celular"],ko:0,e:"검은색 지갑 = cartera negra; 안에 학생증이 있습니다 = adentro está la credencial de estudiante."},
{id:"r3e",s:"R",lv:3,p:"¿Qué va a hacer este fin de semana?",t:"이번 주말에 등산을 가려고 했는데 일기예보를 보니 비가 많이 온다고 해요. 그래서 등산 대신 친구와 박물관에 가기로 했어요.",o:["Ir a un museo con un amigo","Subir a la montaña","Quedarse en casa por la lluvia","Ver el pronóstico del tiempo"],ko:0,e:"등산 대신 친구와 박물관에 가기로 했어요 = en lugar de la montaña, decidió ir al museo con un amigo."},
{id:"r3f",s:"R",lv:3,p:"¿Por qué pasean muchos oficinistas en el parque?",t:"요즘 회사 근처 공원에서 점심시간에 산책하는 직장인이 많아졌다. 짧은 시간이지만 걸으면서 스트레스를 풀고 건강도 챙길 수 있기 때문이다.",o:["Para quitarse el estrés y cuidar su salud","Porque el parque es nuevo","Porque la comida es cara","Porque la empresa lo exige"],ko:0,e:"스트레스를 풀고 건강도 챙길 수 있기 때문이다 = porque pueden liberar estrés y cuidar su salud."},
{id:"r4c",s:"R",lv:4,p:"Elige lo que va en el espacio.",t:"중고 거래 앱을 이용하면 필요 없는 물건을 팔아 돈을 벌 수 있다. 또한 물건을 버리지 않고 다시 사용하게 되므로 ( ).",o:["환경 보호에도 도움이 된다","새 물건이 더 많이 팔린다","물건값이 계속 오른다","쓰레기가 더 많이 생긴다"],ko:1,e:"Reutilizar en vez de tirar (버리지 않고 다시 사용) ayuda al medio ambiente."},
{id:"r4d",s:"R",lv:4,p:"¿Cuál es la idea principal?",t:"많은 사람들이 바쁘다는 이유로 아침을 거른다. 하지만 아침 식사는 하루를 시작하는 데 필요한 에너지를 준다. 아침을 먹으면 집중력이 높아지고 점심에 과식하는 것도 막을 수 있다. 바쁘더라도 간단하게라도 아침을 먹는 것이 좋다.",o:["Conviene desayunar aunque sea algo ligero","El desayuno hace subir de peso","Comer mucho al mediodía es saludable","Hay que desayunar mucho todos los días"],ko:0,e:"La conclusión: 바쁘더라도 간단하게라도 아침을 먹는 것이 좋다 = aunque estés ocupado, desayuna algo sencillo."},
{id:"r4e",s:"R",lv:4,p:"Lee el aviso. ¿Qué es correcto?",t:"〈주민 여러분께〉\n다음 주 화요일 오전 10시부터 오후 4시까지 엘리베이터 점검이 있습니다. 이 시간에는 엘리베이터를 이용하실 수 없으니 양해 부탁드립니다.",o:["El martes no se podrá usar el elevador de 10 a 4","El elevador funcionará con normalidad","La revisión durará toda la semana","Ese día se revisarán las escaleras"],ko:0,e:"화요일 오전 10시부터 오후 4시까지 … 이용하실 수 없으니 = el martes de 10 a 16 h no se podrá usar."},
{id:"r4f",s:"R",lv:4,p:"¿Qué es correcto según el texto?",t:"한국에서는 이사를 하면 이웃에게 떡을 돌리는 문화가 있었다. 새로 온 사람이 인사를 하며 좋은 관계를 맺기 위해서였다. 요즘은 이 문화가 많이 사라졌지만 작은 선물로 인사하는 사람은 여전히 있다.",o:["Todavía hay quien saluda a sus vecinos con un pequeño regalo","La costumbre sigue igual que antes","Los vecinos le regalan tteok a quien llega","Se regala tteok al irse de un lugar"],ko:0,e:"작은 선물로 인사하는 사람은 여전히 있다 = todavía hay quien saluda con un pequeño regalo. Era el recién llegado quien repartía tteok."},
{id:"r5c",s:"R",lv:5,p:"¿Qué es correcto según el texto?",t:"최근 반려동물을 가족처럼 여기는 사람이 늘면서 관련 산업도 빠르게 성장하고 있다. 반려동물 전용 보험과 호텔, 장례 서비스까지 등장했다. 하지만 반려동물을 쉽게 입양했다가 버리는 문제는 여전히 심각하다는 지적도 있다.",o:["Aunque la industria crece, el abandono de mascotas sigue siendo grave","Ya nadie abandona a sus mascotas","No existen seguros para mascotas","La industria de mascotas está disminuyendo"],ko:0,e:"버리는 문제는 여전히 심각하다 = el problema del abandono sigue siendo grave."},
{id:"r5d",s:"R",lv:5,p:"¿Cuál es la actitud del autor?",t:"일회용 컵 사용을 줄이기 위해 매장 안에서 일회용 컵 사용을 금지하는 정책이 시행되었다. 처음에는 불편하다는 의견도 많았지만, 환경을 생각한다면 이 정도의 불편은 감수할 필요가 있다.",o:["Apoya la política aunque sea incómoda","Pide eliminar la política","Le resulta indiferente","Cree que no ayuda al medio ambiente"],ko:0,e:"이 정도의 불편은 감수할 필요가 있다 = vale la pena aceptar esta incomodidad."},
{id:"r5e",s:"R",lv:5,p:"Elige lo que va en el espacio.",t:"우리는 흔히 실패를 부정적으로만 생각한다. 그러나 많은 발명품은 수많은 실패 끝에 탄생했다. 실패는 무엇이 잘못되었는지 알려 주기 때문에 ( ).",o:["성공으로 가는 과정이 될 수 있다","반드시 피해야 한다","아무 의미가 없다","다시 반복해서는 안 된다"],ko:1,e:"그러나 + 발명품은 실패 끝에 탄생 → el fracaso puede ser parte del camino al éxito."},
{id:"r5f",s:"R",lv:5,p:"¿Qué es correcto según el texto?",t:"고령화가 빠르게 진행되면서 노인 일자리 문제가 사회적 과제로 떠오르고 있다. 전문가들은 단순한 일자리 제공을 넘어 노인들이 그동안 쌓아 온 경험과 지식을 활용할 수 있는 일자리를 만들어야 한다고 강조한다.",o:["Los expertos piden empleos que aprovechen la experiencia de los mayores","Ya hay suficientes empleos para personas mayores","Los mayores no quieren trabajar","El envejecimiento de la población se detuvo"],ko:0,e:"경험과 지식을 활용할 수 있는 일자리 = empleos que aprovechen su experiencia y conocimientos."},
{id:"r6c",s:"R",lv:6,p:"¿Cuál es la idea principal?",t:"과학 기술의 발전은 인류에게 풍요를 가져다주었지만, 동시에 그 기술이 초래할 결과에 대한 책임의 문제를 제기한다. 기술 그 자체는 가치 중립적일지 모르나, 그것을 어떻게 사용할지는 결국 인간의 선택에 달려 있다.",o:["Cómo se usa la tecnología depende de la decisión humana","La tecnología es mala por naturaleza","La tecnología decide por sí sola","El progreso solo trae problemas"],ko:0,e:"어떻게 사용할지는 결국 인간의 선택에 달려 있다 = cómo usarla depende, al final, de la elección humana."},
{id:"r6d",s:"R",lv:6,p:"Elige lo que va en el espacio.",t:"독서는 단순히 지식을 얻는 행위가 아니다. 책을 읽으며 우리는 타인의 삶과 생각을 간접적으로 경험하고, 이를 통해 ( ) 기회를 얻는다.",o:["자신을 돌아보고 세상을 이해하는","책을 더 빨리 읽는","시험 점수를 올리는","다른 사람과 경쟁하는"],ko:1,e:"Vivir indirectamente otras vidas (타인의 삶을 간접적으로 경험) permite reflexionar sobre uno mismo y entender el mundo."},
{id:"r6e",s:"R",lv:6,p:"¿Qué es correcto según el texto?",t:"'빨리빨리' 문화는 흔히 한국 사회의 조급함을 드러내는 부정적 특성으로 거론된다. 그러나 이러한 속도 중시 문화가 짧은 기간에 경제 성장과 정보 통신 기술의 발전을 이끈 원동력이 되었다는 평가도 적지 않다.",o:["Hay quienes ven la cultura «ppalli ppalli» como motor del desarrollo","Todos la consideran solo algo negativo","Frenó el crecimiento económico","Ya desapareció de la sociedad coreana"],ko:0,e:"원동력이 되었다는 평가도 적지 않다 = no son pocos quienes la valoran como fuerza impulsora."},
{id:"r6f",s:"R",lv:6,p:"¿Qué es correcto según el texto?",t:"도시 재생은 낡은 건물을 허물고 새로 짓는 재개발과 달리, 지역이 가진 역사와 공동체를 보존하면서 활력을 되찾는 데 초점을 둔다. 따라서 그 성패는 주민의 참여에 크게 좌우된다.",o:["El éxito de la regeneración urbana depende de la participación vecinal","Consiste en demoler los edificios viejos","No toma en cuenta la historia del lugar","Es lo mismo que la reurbanización"],ko:0,e:"성패는 주민의 참여에 크게 좌우된다 = su éxito depende en gran medida de la participación de los vecinos."},
// --- Banco ampliado: comprensión auditiva ---
{id:"l1c",s:"L",lv:1,p:"Escucha. ¿Qué hora es?",a:["M|지금 몇 시예요?","F|세 시 반이에요."],o:["Las 3:30","Las 3:00","Las 4:30","Las 2:30"],ko:0,e:"세 시 반 = tres y media."},
{id:"l1d",s:"L",lv:1,p:"Escucha. ¿Qué celebran?",a:["F|생일 축하해요! 이거 선물이에요.","M|와, 정말 고마워요."],o:["Un cumpleaños","Navidad","Una boda","Una graduación"],ko:0,e:"생일 축하해요 = feliz cumpleaños."},
{id:"l1e",s:"L",lv:1,p:"Escucha. ¿Cuánto cuesta una manzana?",a:["M|이 사과 얼마예요?","F|한 개에 천 원이에요."],o:["1,000 wones","100 wones","10,000 wones","1,500 wones"],ko:0,e:"한 개에 천 원 = mil wones cada una."},
{id:"l1f",s:"L",lv:1,p:"Escucha. ¿Adónde va el hombre?",a:["F|어디에 가요?","M|은행에 가요. 돈을 찾아야 해요."],o:["Al banco","Al hospital","A la escuela","Al mercado"],ko:0,e:"은행에 가요 = voy al banco; 돈을 찾다 = sacar dinero."},
{id:"l2c",s:"L",lv:2,p:"Escucha. ¿Qué hizo la mujer el fin de semana?",a:["M|주말에 뭐 했어요?","F|친구하고 바다에 갔어요. 수영도 했어요."],o:["Fue al mar con una amiga","Fue a la montaña","Se quedó en casa","Trabajó todo el fin de semana"],ko:0,e:"친구하고 바다에 갔어요 = fui al mar con un amigo/una amiga."},
{id:"l2d",s:"L",lv:2,p:"Escucha. ¿Para cuántas personas es la reservación?",a:["F|여보세요, 거기 한국 식당이죠? 오늘 저녁 7시에 네 명 예약하고 싶어요.","M|네, 7시에 네 분이요. 성함이 어떻게 되세요?"],o:["Cuatro","Dos","Siete","Tres"],ko:0,e:"네 명 = cuatro personas. 7시 es la hora."},
{id:"l2e",s:"L",lv:2,p:"Escucha. ¿Qué le aconseja la mujer?",a:["M|머리가 너무 아파요.","F|그럼 약을 먹고 좀 쉬세요."],o:["Tomar medicina y descansar","Ir a trabajar","Hacer ejercicio","Comer algo"],ko:0,e:"약을 먹고 좀 쉬세요 = toma medicina y descansa un poco."},
{id:"l2f",s:"L",lv:2,p:"Escucha. ¿Qué quiere tomar el hombre?",a:["F|커피 마실래요?","M|아니요, 저는 커피를 안 마셔요. 녹차 주세요."],o:["Té verde","Café","Agua","Jugo"],ko:0,e:"녹차 주세요 = deme té verde."},
{id:"l3b",s:"L",lv:3,p:"Escucha. ¿Por cuánto tiempo se puede pedir prestado el libro?",a:["F|이 책을 빌리고 싶은데요.","M|학생증 있으세요? 2주 동안 빌릴 수 있어요."],o:["Dos semanas","Dos días","Un mes","Una semana"],ko:0,e:"2주 동안 = durante dos semanas."},
{id:"l3c",s:"L",lv:3,p:"Escucha. ¿Qué responde la mujer?",a:["M|다음 주에 이사를 하는데 좀 도와줄 수 있어요?","F|그럼요. 토요일 오전에는 시간이 있어요."],o:["Puede ayudar el sábado por la mañana","No puede ayudar","Ayudará el domingo","Ella también se va a mudar"],ko:0,e:"그럼요 = claro; 토요일 오전에는 시간이 있어요 = el sábado en la mañana tengo tiempo."},
{id:"l4b",s:"L",lv:4,p:"Escucha el anuncio. ¿Qué es correcto?",a:["F|고객 여러분께 안내 말씀드립니다. 오늘 오후 6시부터 한 시간 동안 1층 식품 매장에서 과일을 30퍼센트 할인된 가격에 판매합니다."],o:["Hoy de 6 a 7 de la tarde hay 30% de descuento en fruta","El descuento dura todo el día","El descuento es en ropa","La venta es en el tercer piso"],ko:0,e:"오후 6시부터 한 시간 동안 … 과일을 30퍼센트 할인 = desde las 6 por una hora, fruta con 30% de descuento en el 1er piso."},
{id:"l4c",s:"L",lv:4,p:"Escucha. ¿Por qué recomienda la mujer la natación?",a:["M|운동을 시작하려고 하는데 헬스장이 좋을까요, 수영이 좋을까요?","F|허리가 안 좋으시면 수영이 부담이 적어서 더 좋아요."],o:["Porque cansa menos la espalda","Porque es más barata","Porque está más cerca","Porque es más divertida"],ko:0,e:"허리가 안 좋으시면 수영이 부담이 적어서 = si te duele la espalda, nadar exige menos esfuerzo."},
{id:"l5b",s:"L",lv:5,p:"Escucha. ¿Qué opina el hombre?",a:["F|요즘 아이들이 스마트폰을 너무 많이 사용해서 걱정이에요.","M|무조건 못 쓰게 하기보다는 사용 시간을 아이와 함께 정하는 게 효과적이라고 하더라고요."],o:["Es mejor acordar con el niño el tiempo de uso","Hay que prohibir el celular por completo","Hay que dejarlo usarlo sin límite","Conviene comprarle otro teléfono"],ko:0,e:"사용 시간을 아이와 함께 정하는 게 효과적 = es eficaz decidir junto con el niño el tiempo de uso."},
{id:"l5c",s:"L",lv:5,p:"Escucha. ¿Qué le preocupa a la mujer?",a:["M|우리 회사도 주 4일 근무제를 도입한다는데 어떻게 생각해요?","F|쉬는 날이 늘어서 좋긴 하지만, 근무일에 일이 몰려서 오히려 더 힘들어질까 봐 걱정돼요."],o:["Que el trabajo se acumule en los días laborales","Que le paguen menos","Que no le den vacaciones","Que la empresa cierre"],ko:0,e:"근무일에 일이 몰려서 더 힘들어질까 봐 = teme que el trabajo se concentre en los días laborales."},
{id:"l6b",s:"L",lv:6,p:"Escucha. ¿Cuál es la idea central?",a:["M|흔히 꿀벌이 사라지면 꿀만 없어진다고 생각합니다. 그러나 꿀벌은 많은 농작물의 꽃가루를 옮겨 열매를 맺게 합니다. 따라서 꿀벌의 감소는 식량 생산 전체를 위협하는 문제입니다."],o:["La desaparición de las abejas amenaza la producción de alimentos","Si desaparecen las abejas, solo se pierde la miel","Las abejas dañan los cultivos","Hay demasiadas abejas en el campo"],ko:0,e:"꿀벌의 감소는 식량 생산 전체를 위협 = la disminución de abejas amenaza toda la producción de alimentos."},
{id:"l6c",s:"L",lv:6,p:"Escucha. ¿Cuál es la idea central?",a:["F|우리는 보통 결정을 내릴 때 충분히 생각한 뒤 합리적으로 판단한다고 믿습니다. 하지만 실제로는 첫인상이나 그때의 기분처럼 사소한 요소가 판단에 큰 영향을 미친다는 연구 결과가 많습니다."],o:["Detalles como el estado de ánimo influyen mucho en nuestras decisiones","Siempre decidimos de forma racional","La primera impresión no importa","Pensar mucho evita cualquier error"],ko:0,e:"사소한 요소가 판단에 큰 영향을 미친다 = factores pequeños influyen mucho en el juicio."},
// --- Banco ampliado (2026-11-08): +90 preguntas ---
{id:"v1x1",s:"V",lv:1,p:"Elige la palabra correcta para el espacio.",t:"물을 ( ).",o:["마셔요", "먹어요", "봐요", "가요"],ko:1,e:"El agua se bebe: 물을 마셔요 = bebo agua."},
{id:"v1x2",s:"V",lv:1,p:"Elige la palabra correcta para el espacio.",t:"저는 멕시코( ) 왔어요.",o:["에서", "에", "을", "는"],ko:1,e:"에서 con verbos de movimiento indica el origen: vine DE México."},
{id:"v1x3",s:"V",lv:1,p:"¿Qué significa la palabra?",t:"학교",o:["Escuela", "Hospital", "Tienda", "Casa"],ko:0,e:"학교 = escuela. 병원 = hospital, 가게 = tienda, 집 = casa."},
{id:"v1x4",s:"V",lv:1,p:"Elige la palabra correcta para el espacio.",t:"이것은 제 ( )이에요. 저는 이 가방을 좋아해요.",o:["가방", "의자", "시계", "신발"],ko:1,e:"La segunda oración habla de 이 가방 (esta bolsa), así que la respuesta es 가방."},
{id:"v1x5",s:"V",lv:1,p:"Elige la respuesta correcta.",t:"A: 이름이 뭐예요?\nB: ( )",o:["제 이름은 소피아예요.", "저는 스무 살이에요.", "멕시코에서 왔어요.", "네, 좋아요."],ko:1,e:"이름이 뭐예요? = ¿Cómo te llamas? → 제 이름은 … 예요."},
{id:"v1x6",s:"V",lv:1,p:"Elige la palabra correcta para el espacio.",t:"오늘은 날씨가 ( ). 그래서 에어컨을 켰어요.",o:["더워요", "추워요", "시원해요", "흐려요"],ko:1,e:"Si prendió el aire acondicionado, hace calor: 더워요."},
{id:"v2x1",s:"V",lv:2,p:"Elige la forma correcta.",t:"내일 친구하고 영화를 ( ).",o:["볼 거예요", "봤어요", "보세요", "봤습니다"],ko:1,e:"내일 = mañana → futuro: -(으)ㄹ 거예요."},
{id:"v2x2",s:"V",lv:2,p:"Elige la partícula correcta.",t:"저는 사과( ) 좋아해요.",o:["를", "가", "에", "에서"],ko:1,e:"좋아하다 lleva objeto directo: 사과를 좋아해요. (사과 termina en vocal → 를)."},
{id:"v2x3",s:"V",lv:2,p:"Elige la expresión correcta.",t:"배가 고프( ) 밥을 먹었어요.",o:["아서", "지만", "고", "면"],ko:1,e:"-아서/어서 expresa causa: como tenía hambre, comí."},
{id:"v2x4",s:"V",lv:2,p:"Elige la palabra correcta.",t:"버스가 안 와요. 그래서 택시를 ( ).",o:["탔어요", "찍었어요", "입었어요", "썼어요"],ko:1,e:"Los medios de transporte se «suben»: 택시를 타다."},
{id:"v2x5",s:"V",lv:2,p:"Elige la forma correcta.",t:"여기에서 사진을 찍( ) 돼요?",o:["어도", "으면", "지만", "어서"],ko:1,e:"-아도/어도 되다 = pedir permiso: ¿puedo tomar fotos aquí?"},
{id:"v2x6",s:"V",lv:2,p:"Elige lo que significa lo mismo.",t:"저는 수영을 못해요.",o:["저는 수영을 할 수 없어요.", "저는 수영을 좋아해요.", "저는 수영을 배우고 싶어요.", "저는 수영을 잘해요."],ko:1,e:"못하다 = no poder hacer algo = -(으)ㄹ 수 없다."},
{id:"v3x1",s:"V",lv:3,p:"Elige la terminación correcta.",t:"한국에 가( ) 꼭 경복궁에 가 보세요.",o:["면", "지만", "는데도", "거나"],ko:1,e:"-(으)면 = si/cuando: si vas a Corea, no dejes de visitar Gyeongbokgung."},
{id:"v3x2",s:"V",lv:3,p:"Elige la expresión correcta.",t:"밖에 비가 오( ) 우산을 가지고 가세요.",o:["니까", "는데도", "더니", "자마자"],ko:1,e:"-(으)니까 da una razón para una orden o sugerencia: como llueve, lleva paraguas."},
{id:"v3x3",s:"V",lv:3,p:"Elige la forma correcta.",t:"한국 드라마를 많이 ( ) 한국어 실력이 늘었어요.",o:["본 덕분에", "보는 대신에", "보기 전에", "보는 동안"],ko:1,e:"-(으)ㄴ 덕분에 = gracias a: gracias a ver muchos dramas, mejoró mi coreano."},
{id:"v3x4",s:"V",lv:3,p:"Elige la palabra correcta.",t:"이 옷은 너무 커서 한 치수 작은 것으로 ( ) 싶어요.",o:["바꾸고", "빌리고", "버리고", "고치고"],ko:1,e:"바꾸다 = cambiar (por otra talla)."},
{id:"v3x5",s:"V",lv:3,p:"Elige la expresión correcta.",t:"집에 도착하( ) 전화할게요.",o:["자마자", "느라고", "는데", "더라도"],ko:1,e:"-자마자 = en cuanto: te llamo en cuanto llegue a casa."},
{id:"v3x6",s:"V",lv:3,p:"Elige lo que significa lo mismo.",t:"시험 공부를 하느라고 잠을 못 잤어요.",o:["시험 공부를 했기 때문에 잠을 못 잤어요.", "잠을 자고 나서 시험 공부를 했어요.", "시험이 없어서 잠을 잤어요.", "잠을 자면서 공부했어요."],ko:1,e:"-느라고 = por estar haciendo algo (causa de un resultado negativo)."},
{id:"v4x1",s:"V",lv:4,p:"Elige la expresión correcta.",t:"그 식당은 맛있( ) 가격도 싸서 늘 사람이 많다.",o:["을 뿐만 아니라", "는 바람에", "는 반면에", "을까 봐"],ko:1,e:"-(으)ㄹ 뿐만 아니라 = no solo… sino también: no solo es rico, también es barato."},
{id:"v4x2",s:"V",lv:4,p:"Elige la expresión correcta.",t:"늦( ) 택시를 탔는데 길이 막혀서 결국 지각했다.",o:["을까 봐", "는 김에", "도록", "는 척"],ko:1,e:"-(으)ㄹ까 봐 = por miedo a que: tomé un taxi por miedo a llegar tarde."},
{id:"v4x3",s:"V",lv:4,p:"Elige la palabra correcta.",t:"회의 시간을 다시 정해야 하니까 모두의 일정을 ( ) 주세요.",o:["확인해", "포기해", "실망해", "후회해"],ko:1,e:"일정을 확인하다 = revisar/confirmar la agenda."},
{id:"v4x4",s:"V",lv:4,p:"Elige la expresión correcta.",t:"시장에 가( ) 과일도 좀 사 오세요.",o:["는 김에", "는 대로", "는 바람에", "는 탓에"],ko:1,e:"-는 김에 = aprovechando que: ya que vas al mercado, trae fruta."},
{id:"v4x5",s:"V",lv:4,p:"Elige lo que significa lo mismo.",t:"그 사람은 아무것도 모르는 척했다.",o:["알면서도 모르는 것처럼 행동했다.", "정말로 아무것도 몰랐다.", "모르는 것을 물어보았다.", "모든 것을 설명해 주었다."],ko:1,e:"-는 척하다 = fingir: actuó como si no supiera nada."},
{id:"v4x6",s:"V",lv:4,p:"Elige la palabra correcta.",t:"환절기에는 감기에 걸리기 쉬우니까 건강 관리에 ( )를 기울여야 한다.",o:["주의", "의견", "정답", "순서"],ko:1,e:"주의를 기울이다 = poner atención. En cambio de estación es fácil resfriarse, hay que cuidar la salud."},
{id:"v5x1",s:"V",lv:5,p:"Elige la expresión correcta.",t:"아무리 바쁘( ) 식사는 거르지 마세요.",o:["더라도", "거든", "다가", "길래"],ko:1,e:"아무리 -더라도 = por más que: por más ocupado que estés, no te saltes comidas."},
{id:"v5x2",s:"V",lv:5,p:"Elige la palabra correcta.",t:"이번 사고의 원인을 정확히 ( ) 위해 전문가들이 조사를 시작했다.",o:["규명하기", "보급하기", "유지하기", "축소하기"],ko:1,e:"원인을 규명하다 = esclarecer la causa."},
{id:"v5x3",s:"V",lv:5,p:"Elige la expresión correcta.",t:"그는 성공하( ) 어떤 어려움도 참아 냈다.",o:["기 위해서라면", "는 바람에", "자마자", "는 둥 마는 둥"],ko:1,e:"-기 위해서라면 = si es para (lograr algo): con tal de triunfar, soportó cualquier dificultad."},
{id:"v5x4",s:"V",lv:5,p:"Elige lo que significa lo mismo.",t:"그 영화는 기대했던 것만 못했다.",o:["그 영화는 기대보다 별로였다.", "그 영화는 기대보다 훨씬 좋았다.", "그 영화를 아직 보지 못했다.", "그 영화는 기대한 만큼 좋았다."],ko:1,e:"-만 못하다 = no estar a la altura de: fue peor de lo esperado."},
{id:"v5x5",s:"V",lv:5,p:"Elige la palabra correcta.",t:"신제품에 대한 소비자들의 ( )이 뜨거워 출시 첫날 모두 팔렸다.",o:["반응", "반성", "반대", "반복"],ko:1,e:"반응이 뜨겁다 = tener una respuesta entusiasta."},
{id:"v5x6",s:"V",lv:5,p:"Elige la expresión correcta.",t:"그 일은 혼자 하( ) 어려우니 팀을 꾸리는 게 좋겠다.",o:["기에는", "기는커녕", "다시피", "는 한"],ko:1,e:"-기에는 = para (hacer algo) resulta…: es demasiado difícil para hacerlo solo."},
{id:"v6x1",s:"V",lv:6,p:"¿Qué significa la expresión?",t:"그 사람은 발이 넓어서 모르는 사람이 없다.",o:["Conoce a mucha gente", "Camina muy rápido", "Tiene los pies grandes", "Viaja mucho por trabajo"],ko:0,e:"발이 넓다 (tener los pies anchos) = tener muchos contactos."},
{id:"v6x2",s:"V",lv:6,p:"¿Qué significa la expresión?",t:"시험 결과를 기다리느라 가슴을 졸였다.",o:["Estaba muy nervioso esperando", "Estaba muy contento", "No le importaba el resultado", "Le dolía el pecho"],ko:0,e:"가슴을 졸이다 = estar con el alma en vilo, muy ansioso."},
{id:"v6x3",s:"V",lv:6,p:"Elige la expresión correcta.",t:"그는 실력이 뛰어나( ) 성격도 겸손해서 모두에게 존경받는다.",o:["거니와", "건만", "더니만", "느니"],ko:1,e:"-거니와 = además de que (registro escrito): además de ser muy capaz, es humilde."},
{id:"v6x4",s:"V",lv:6,p:"¿Qué significa el refrán?",t:"가는 말이 고와야 오는 말이 곱다.",o:["Si hablas con amabilidad, te responderán igual", "Hay que hablar poco", "Las palabras se las lleva el viento", "Quien habla mucho se equivoca mucho"],ko:0,e:"Literalmente: si las palabras que van son bonitas, las que vuelven también lo serán."},
{id:"v6x5",s:"V",lv:6,p:"Elige la palabra correcta.",t:"그 정책은 장기적인 관점에서 ( )을 따져 보고 결정해야 한다.",o:["득실", "득점", "실수", "손님"],ko:1,e:"득실을 따지다 = sopesar ventajas y desventajas (ganancias y pérdidas)."},
{id:"v6x6",s:"V",lv:6,p:"Elige la expresión correcta.",t:"노력하지 않고 성공하기를 바라는 것은 감나무 밑에서 감 떨어지기를 기다리는 ( )이다.",o:["격", "탓", "척", "체"],ko:1,e:"-는 격이다 = es como si…: es como esperar bajo el caqui a que caiga la fruta."},
{id:"r1x1",s:"R",lv:1,p:"Lee y responde: ¿Qué le gusta a esta persona?",t:"저는 한국 음식을 좋아해요.\n특히 김밥을 자주 먹어요.",o:["El kimbap", "La pizza", "El café", "El pan"],ko:0,e:"특히 김밥을 자주 먹어요 = sobre todo como kimbap seguido."},
{id:"r1x2",s:"R",lv:1,p:"Lee y responde: ¿A qué hora se levanta?",t:"저는 매일 아침 일곱 시에 일어나요.\n그리고 여덟 시에 학교에 가요.",o:["A las siete", "A las ocho", "A las seis", "A las nueve"],ko:0,e:"일곱 시 = 7:00. 여덟 시 (8:00) es cuando va a la escuela."},
{id:"r1x3",s:"R",lv:1,p:"Lee y responde: ¿Dónde está el gato?",t:"우리 집에 고양이가 있어요.\n고양이는 지금 침대 위에 있어요.",o:["Sobre la cama", "Debajo de la mesa", "En la cocina", "Afuera de la casa"],ko:0,e:"침대 위 = sobre la cama."},
{id:"r2x1",s:"R",lv:2,p:"Lee el anuncio. ¿Qué es correcto?",t:"〈한국어 교실〉\n매주 화요일, 목요일 저녁 7시\n장소: 문화 센터 3층\n수업료: 무료",o:["Las clases son gratis", "Hay clase los lunes", "La clase es en la mañana", "Es en el primer piso"],ko:0,e:"수업료: 무료 = la colegiatura es gratis. Martes y jueves a las 7 p. m., 3.er piso."},
{id:"r2x2",s:"R",lv:2,p:"Lee el mensaje. ¿Por qué no puede ir Jimin?",t:"수진 씨, 미안해요. 오늘 감기에 걸려서 모임에 못 가요. 다음 주에 만나요. - 지민",o:["Porque está resfriado", "Porque tiene que trabajar", "Porque está de viaje", "Porque olvidó la cita"],ko:0,e:"감기에 걸려서 = porque me dio gripa/resfriado."},
{id:"r2x3",s:"R",lv:2,p:"Lee y responde: ¿Qué es correcto?",t:"저는 주말마다 등산을 해요. 산에 올라가면 기분이 좋아요. 이번 주말에는 동생하고 같이 갈 거예요.",o:["Este fin de semana irá con su hermano(a) menor", "Nunca va a la montaña", "Va a la montaña solo entre semana", "No le gusta subir montañas"],ko:0,e:"이번 주말에는 동생하고 같이 갈 거예요 = este fin irá con su hermano(a) menor."},
{id:"r3x1",s:"R",lv:3,p:"¿Por qué escribió esta persona?",t:"안녕하세요. 어제 이 가게에서 운동화를 샀는데 사이즈가 작아서 교환하고 싶습니다. 영수증도 가지고 있습니다. 언제 방문하면 될까요?",o:["Para cambiar unos tenis por otra talla", "Para quejarse del precio", "Para pedir trabajo", "Para preguntar el horario de la tienda"],ko:0,e:"사이즈가 작아서 교환하고 싶습니다 = quiero cambiarlos porque la talla es pequeña."},
{id:"r3x2",s:"R",lv:3,p:"Elige lo que va en el espacio.",t:"저는 처음에 한국어가 너무 어려웠습니다. 하지만 매일 조금씩 공부했더니 지금은 ( ).",o:["간단한 대화를 할 수 있게 되었습니다", "한국어 공부를 그만두었습니다", "한국어를 전혀 모릅니다", "공부할 시간이 없습니다"],ko:1,e:"하지만 + 매일 공부했더니 → resultado positivo: ahora puede tener conversaciones sencillas."},
{id:"r3x3",s:"R",lv:3,p:"¿Qué es correcto según el texto?",t:"이 박물관은 월요일에 문을 닫습니다. 입장료는 어른 3,000원, 어린이 1,500원이고 65세 이상은 무료입니다.",o:["Las personas de 65 años o más entran gratis", "Abre todos los días", "Los niños no pagan", "Los adultos pagan 1,500 wones"],ko:0,e:"65세 이상은 무료 = gratis a partir de 65 años. Cierra los lunes."},
{id:"r3x4",s:"R",lv:3,p:"Lee y responde: ¿Qué piensa hacer esta persona?",t:"요즘 너무 피곤해서 운동을 시작하기로 했어요. 회사 근처 수영장에 등록했는데 다음 주 월요일부터 아침마다 다닐 거예요.",o:["Nadar cada mañana desde el próximo lunes", "Dejar su trabajo", "Mudarse cerca de la oficina", "Dormir más los fines de semana"],ko:0,e:"수영장에 등록 … 아침마다 다닐 거예요 = se inscribió en la alberca e irá cada mañana."},
{id:"r3x5",s:"R",lv:3,p:"¿Cuál es el tema del texto?",t:"한국에서는 새해 첫날 떡국을 먹습니다. 떡국을 먹으면 한 살을 더 먹는다고 생각합니다. 그래서 아이들에게 '떡국 몇 그릇 먹었어?'라고 나이를 묻기도 합니다.",o:["La costumbre de comer tteokguk en Año Nuevo", "Cómo cocinar arroz", "Los cumpleaños de los niños", "Los restaurantes de Seúl"],ko:0,e:"El texto explica la tradición del 떡국 el primer día del año."},
{id:"r3x6",s:"R",lv:3,p:"Lee el aviso. ¿Qué es correcto?",t:"〈엘리베이터 점검 안내〉\n10월 5일(토) 오전 9시~12시\n점검 시간에는 계단을 이용해 주시기 바랍니다.",o:["Durante la revisión hay que usar las escaleras", "El elevador estará cerrado todo el día", "La revisión es el domingo", "La revisión es en la tarde"],ko:0,e:"계단을 이용해 주시기 바랍니다 = por favor usen las escaleras. Sábado de 9 a 12."},
{id:"r4x1",s:"R",lv:4,p:"¿Cuál es la idea principal?",t:"아침을 거르는 사람이 많다. 그러나 아침 식사를 하면 뇌에 에너지가 공급되어 집중력이 높아지고, 점심때 과식하는 것도 막을 수 있다. 간단하게라도 아침을 먹는 습관을 들이는 것이 좋다.",o:["Conviene desayunar aunque sea algo sencillo", "Desayunar engorda", "Es mejor comer mucho al mediodía", "Mucha gente desayuna demasiado"],ko:0,e:"간단하게라도 아침을 먹는 습관을 들이는 것이 좋다 = es bueno crear el hábito de desayunar aunque sea poco."},
{id:"r4x2",s:"R",lv:4,p:"Elige lo que va en el espacio.",t:"물건을 살 때 필요하지 않은데도 할인한다는 이유만으로 사는 경우가 많다. 이런 소비를 줄이려면 쇼핑하기 전에 ( ) 것이 도움이 된다.",o:["살 물건의 목록을 미리 만드는", "할인 쿠폰을 많이 모으는", "친구와 함께 쇼핑하는", "카드를 여러 장 만드는"],ko:1,e:"Para evitar compras innecesarias, ayuda hacer antes una lista de lo que se va a comprar."},
{id:"r4x3",s:"R",lv:4,p:"¿Qué es correcto según el texto?",t:"한국의 대중교통은 환승 할인 제도가 있어서 버스에서 지하철로 갈아탈 때 30분 이내라면 추가 요금이 거의 없다. 단, 교통카드를 사용해야 하며 내릴 때도 카드를 찍어야 한다.",o:["Para el descuento hay que pasar la tarjeta también al bajar", "El transbordo siempre cuesta el doble", "Se puede pagar en efectivo para el descuento", "No hay límite de tiempo para transbordar"],ko:0,e:"내릴 때도 카드를 찍어야 한다 = también hay que pasar la tarjeta al bajarse."},
{id:"r4x4",s:"R",lv:4,p:"¿Por qué el autor recomienda esto?",t:"외국어를 배울 때 단어만 외우는 것보다 문장으로 외우는 것이 효과적이다. 문장 속에서 단어가 어떻게 쓰이는지 함께 익힐 수 있기 때문이다.",o:["Porque se aprende cómo se usa la palabra en contexto", "Porque las oraciones son más cortas", "Porque así se aprenden más palabras por día", "Porque es más fácil olvidar las palabras"],ko:0,e:"문장 속에서 단어가 어떻게 쓰이는지 익힐 수 있기 때문 = se aprende el uso de la palabra dentro de la oración."},
{id:"r4x5",s:"R",lv:4,p:"¿Qué es correcto según el texto?",t:"최근 중고 거래 앱을 이용하는 사람이 크게 늘었다. 필요 없는 물건을 팔아 돈을 벌 수 있고, 새 물건보다 싸게 살 수 있기 때문이다. 다만 직접 만나서 거래할 때는 사람이 많은 장소를 고르는 것이 안전하다.",o:["Al comprar en persona conviene un lugar concurrido", "Las apps de segunda mano están desapareciendo", "Lo usado es más caro que lo nuevo", "Es más seguro verse en un lugar solitario"],ko:0,e:"사람이 많은 장소를 고르는 것이 안전하다 = es más seguro elegir un lugar con mucha gente."},
{id:"r4x6",s:"R",lv:4,p:"Elige lo que va en el espacio.",t:"여행을 가기 전에 그 나라의 문화를 조금이라도 알아 두면 좋다. 나라마다 예절이 달라서 우리에게는 자연스러운 행동이 ( ) 수 있기 때문이다.",o:["그곳에서는 무례하게 보일", "더 친절하게 보일", "아무 문제가 없을", "돈을 아낄"],ko:1,e:"나라마다 예절이 달라서 → algo natural para nosotros puede parecer grosero allá."},
{id:"r5x1",s:"R",lv:5,p:"¿Cuál es la idea principal?",t:"수면 부족은 단순히 피곤함으로 끝나지 않는다. 잠이 부족하면 면역력이 떨어지고 기억력과 판단력도 흐려진다. 따라서 충분한 수면은 개인의 선택이 아니라 건강을 지키기 위한 필수 조건으로 보아야 한다.",o:["Dormir lo suficiente es una condición esencial para la salud", "Dormir poco solo causa cansancio", "El sueño no afecta la memoria", "Cada quien debe decidir cuánto dormir sin preocuparse"],ko:0,e:"충분한 수면은 … 필수 조건으로 보아야 한다 = el sueño suficiente debe verse como condición indispensable."},
{id:"r5x2",s:"R",lv:5,p:"¿Qué es correcto según el texto?",t:"한때 사라질 위기에 놓였던 한옥이 최근 다시 주목받고 있다. 자연 소재로 지어져 친환경적이라는 점과 전통적인 아름다움이 젊은 세대에게 새롭게 다가가고 있기 때문이다. 한옥을 개조한 카페와 숙소가 늘어난 것도 이러한 흐름을 보여 준다.",o:["Las casas tradicionales coreanas atraen de nuevo a los jóvenes", "Los hanok ya desaparecieron", "Los hanok se construyen con plástico", "A los jóvenes no les interesan los hanok"],ko:0,e:"젊은 세대에게 새롭게 다가가고 있다 = están llegando de nuevo a la generación joven."},
{id:"r5x3",s:"R",lv:5,p:"¿Cuál es la actitud del autor?",t:"온라인 수업은 시간과 장소의 제약을 줄여 주었다. 그러나 학생들 사이의 교류가 줄어든다는 한계도 분명하다. 따라서 온라인 수업을 무조건 확대하기보다는 대면 수업과 적절히 병행하는 방안을 찾아야 한다.",o:["Propone combinar clases en línea y presenciales", "Quiere eliminar las clases en línea", "Cree que solo debe haber clases en línea", "No le preocupa la interacción entre estudiantes"],ko:0,e:"대면 수업과 적절히 병행하는 방안을 찾아야 한다 = hay que combinarlas adecuadamente con clases presenciales."},
{id:"r5x4",s:"R",lv:5,p:"Elige lo que va en el espacio.",t:"기업이 사회 공헌 활동을 하는 이유는 단지 이미지를 좋게 하기 위해서만은 아니다. 지역 사회가 건강해야 기업도 오래 성장할 수 있기 때문에, 사회 공헌은 결국 ( ) 투자라고 할 수 있다.",o:["기업 자신의 미래를 위한", "정부를 위한", "경쟁사를 돕기 위한", "광고만을 위한"],ko:1,e:"Si la comunidad está sana, la empresa crece → la contribución social es una inversión en su propio futuro."},
{id:"r5x5",s:"R",lv:5,p:"¿Qué es correcto según el texto?",t:"한국의 PC방은 단순히 게임을 하는 공간을 넘어 하나의 문화로 자리 잡았다. 저렴한 요금으로 빠른 인터넷을 이용할 수 있고 음식까지 주문할 수 있어 친구들과 시간을 보내는 장소로 인기가 높다.",o:["Los PC bang son populares para pasar tiempo con amigos", "Los PC bang son muy caros", "En los PC bang no se puede pedir comida", "Solo los usan personas mayores"],ko:0,e:"친구들과 시간을 보내는 장소로 인기가 높다 = es popular como lugar para pasar tiempo con amigos."},
{id:"r5x6",s:"R",lv:5,p:"¿Por qué escribió el autor este texto?",t:"최근 일부 관광지에서 관광객이 너무 많이 몰려 주민들의 생활이 불편해지는 문제가 생기고 있다. 관광 수입도 중요하지만, 주민의 삶을 보호하기 위해 방문객 수를 조절하는 제도를 검토할 필요가 있다.",o:["Para proponer regular el número de visitantes", "Para promover más turismo a cualquier costo", "Para quejarse de los precios de los hoteles", "Para recomendar lugares turísticos"],ko:0,e:"방문객 수를 조절하는 제도를 검토할 필요가 있다 = hay que considerar un sistema para regular a los visitantes."},
{id:"r6x1",s:"R",lv:6,p:"¿Cuál es la idea principal?",t:"번역은 한 언어의 단어를 다른 언어의 단어로 바꾸는 기계적인 작업이 아니다. 원문에 담긴 문화적 맥락과 뉘앙스를 이해하고, 그것을 도착어 독자가 자연스럽게 받아들일 수 있도록 다시 표현하는 창조적인 작업이다.",o:["Traducir es recrear el contexto y los matices para el lector", "Traducir es cambiar palabra por palabra", "Las máquinas traducen mejor que las personas", "La cultura no importa al traducir"],ko:0,e:"원문의 맥락과 뉘앙스를 … 다시 표현하는 창조적인 작업 = un trabajo creativo de volver a expresar contexto y matices."},
{id:"r6x2",s:"R",lv:6,p:"Elige lo que va en el espacio.",t:"흔히 창의성은 타고나는 재능이라고 여겨진다. 그러나 많은 연구는 창의성이 기존의 지식을 새로운 방식으로 연결하는 능력이라는 점을 보여 준다. 그렇다면 창의성을 기르기 위해서는 ( ) 것이 무엇보다 중요하다.",o:["다양한 분야의 지식을 폭넓게 쌓는", "타고난 재능을 기다리는", "한 가지 방법만 반복하는", "다른 사람의 생각을 무시하는"],ko:1,e:"Si la creatividad conecta conocimientos de forma nueva, lo importante es acumular conocimiento amplio y variado."},
{id:"r6x3",s:"R",lv:6,p:"¿Qué es correcto según el texto?",t:"문화재 복원은 원래의 모습을 되살리는 일이지만, 어느 시점의 모습을 '원래'로 볼 것인지는 쉽지 않은 문제다. 오랜 세월 동안 여러 차례 고쳐진 건축물의 경우, 특정 시대만을 기준으로 삼으면 그 이후의 역사가 지워질 수 있기 때문이다.",o:["Elegir qué época restaurar puede borrar parte de la historia", "Restaurar es siempre sencillo", "Los edificios antiguos nunca se modificaron", "La restauración debe ignorar la historia"],ko:0,e:"특정 시대만을 기준으로 삼으면 그 이후의 역사가 지워질 수 있다 = tomar una sola época como base puede borrar la historia posterior."},
{id:"r6x4",s:"R",lv:6,p:"¿Cuál es la actitud del autor?",t:"경제 성장률이라는 숫자만으로 국민의 삶의 질을 판단하는 것은 한계가 있다. 소득이 늘어도 불평등이 심해지거나 여가 시간이 줄어든다면 그것을 진정한 발전이라고 부르기 어렵다.",o:["Duda que el crecimiento económico por sí solo mida el bienestar", "Cree que el crecimiento es lo único importante", "Opina que el ocio no tiene relación con la calidad de vida", "Está a favor de reducir el ingreso"],ko:0,e:"숫자만으로 … 판단하는 것은 한계가 있다 = juzgar solo con esa cifra tiene límites."},
{id:"r6x5",s:"R",lv:6,p:"Elige lo que va en el espacio.",t:"SNS는 개인이 목소리를 낼 수 있는 통로를 넓혔다. 하지만 자신과 비슷한 의견만 접하게 되는 경향이 강해지면서 ( ) 우려도 커지고 있다.",o:["사회적 갈등이 오히려 깊어질 수 있다는", "의견을 말할 곳이 사라진다는", "정보가 너무 부족해진다는", "모든 사람이 같은 생각을 하게 된다는 기대"],ko:1,e:"하지만 + ver solo opiniones parecidas → preocupa que los conflictos sociales se profundicen."},
{id:"r6x6",s:"R",lv:6,p:"¿Qué es correcto según el texto?",t:"판소리는 한 명의 소리꾼이 고수의 북장단에 맞춰 긴 이야기를 노래와 말, 몸짓으로 풀어내는 전통 공연 예술이다. 관객이 '얼씨구', '좋다'와 같은 추임새로 호응하며 공연에 참여한다는 점도 특징이다.",o:["En el pansori el público participa con exclamaciones", "El pansori lo cantan muchas personas a la vez", "El pansori no usa tambor", "El público debe permanecer en silencio"],ko:0,e:"관객이 추임새로 호응하며 공연에 참여한다 = el público participa con exclamaciones (추임새)."},
{id:"l1x1",s:"L",lv:1,p:"Escucha. ¿Qué día es hoy?",a:["F|오늘은 금요일이에요. 내일은 주말이에요."],o:["Viernes", "Sábado", "Lunes", "Domingo"],ko:0,e:"오늘은 금요일이에요 = hoy es viernes."},
{id:"l1x2",s:"L",lv:1,p:"Escucha. ¿Qué compra el hombre?",a:["M|우유 하나하고 빵 두 개 주세요."],o:["Una leche y dos panes", "Dos leches y un pan", "Un café y un pan", "Tres panes"],ko:0,e:"우유 하나 + 빵 두 개 = una leche y dos panes."},
{id:"l1x3",s:"L",lv:1,p:"Escucha. ¿De dónde es la mujer?",a:["M|어느 나라 사람이에요?", "F|저는 멕시코 사람이에요."],o:["De México", "De Corea", "De España", "De Japón"],ko:0,e:"저는 멕시코 사람이에요 = soy mexicana."},
{id:"l1x4",s:"L",lv:1,p:"Escucha. ¿Adónde va el hombre?",a:["F|어디에 가요?", "M|은행에 가요. 돈을 찾아요."],o:["Al banco", "Al hospital", "A la escuela", "Al mercado"],ko:0,e:"은행에 가요 = voy al banco."},
{id:"l1x5",s:"L",lv:1,p:"Escucha. ¿Qué hora es?",a:["F|지금 몇 시예요?", "M|세 시 삼십 분이에요."],o:["3:30", "13:00", "3:13", "4:30"],ko:0,e:"세 시 (3 en punto, números nativos) + 삼십 분 (30 minutos, sino-coreanos) = 3:30."},
{id:"l1x6",s:"L",lv:1,p:"Escucha. ¿Qué responde la mujer?",a:["M|커피 좋아해요?", "F|네, 아주 좋아해요."],o:["Que le gusta mucho el café", "Que no toma café", "Que prefiere té", "Que no sabe"],ko:0,e:"네, 아주 좋아해요 = sí, me gusta mucho."},
{id:"l2x1",s:"L",lv:2,p:"Escucha. ¿Cuándo es la cita?",a:["M|우리 언제 만날까요?", "F|다음 주 수요일 오후 두 시 어때요?", "M|좋아요."],o:["El próximo miércoles a las 2 p. m.", "Este miércoles a las 12", "El próximo martes a las 2 p. m.", "Hoy en la tarde"],ko:0,e:"다음 주 수요일 오후 두 시 = el próximo miércoles a las 2 de la tarde."},
{id:"l2x2",s:"L",lv:2,p:"Escucha. ¿Qué va a hacer el hombre?",a:["F|이번 방학에 뭐 할 거예요?", "M|부산에 가서 바다를 볼 거예요."],o:["Ir a Busan a ver el mar", "Quedarse en casa", "Trabajar en Seúl", "Estudiar inglés"],ko:0,e:"부산에 가서 바다를 볼 거예요 = iré a Busan a ver el mar."},
{id:"l2x3",s:"L",lv:2,p:"Escucha. ¿Dónde están hablando?",a:["M|어디가 아프세요?", "F|어제부터 목이 아프고 열이 나요."],o:["En un consultorio médico", "En un restaurante", "En un banco", "En una tienda de ropa"],ko:0,e:"어디가 아프세요? = ¿qué le duele? → consulta médica."},
{id:"l2x4",s:"L",lv:2,p:"Escucha. ¿Por qué llegó tarde la mujer?",a:["M|왜 늦었어요?", "F|미안해요. 길이 너무 막혔어요."],o:["Por el tráfico", "Porque se quedó dormida", "Porque perdió el autobús", "Porque estaba enferma"],ko:0,e:"길이 막혔어요 = había mucho tráfico."},
{id:"l2x5",s:"L",lv:2,p:"Escucha. ¿Cuánto paga en total el hombre?",a:["M|이 티셔츠 얼마예요?", "F|만 원이에요. 두 장 사시면 만 팔천 원이에요.", "M|그럼 두 장 주세요."],o:["18,000 wones", "10,000 wones", "20,000 wones", "8,000 wones"],ko:0,e:"두 장 사시면 만 팔천 원 = dos piezas por 18,000 wones, y compra dos."},
{id:"l2x6",s:"L",lv:2,p:"Escucha. ¿Qué pide la mujer?",a:["F|저기요, 여기 물 좀 주세요.", "M|네, 잠깐만 기다리세요."],o:["Agua", "La cuenta", "El menú", "Una cuchara"],ko:0,e:"물 좀 주세요 = deme agua, por favor."},

const EXAM_MIN=30;
// Cuántas preguntas salen por sección y nivel en cada examen (30 en total)
const BLUEPRINT={V:{1:2,2:2,3:2,4:2,5:2,6:2},R:{1:1,2:1,3:2,4:2,5:2,6:2},L:{1:2,2:2,3:1,4:1,5:1,6:1}};
const EXAM_N=Object.values(BLUEPRINT).reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0);
const SEC_N=Object.fromEntries(Object.entries(BLUEPRINT).map(([s,o])=>[s,Object.values(o).reduce((x,y)=>x+y,0)]));
const BYID=Object.fromEntries(BANK.map(q=>[q.id,q]));
let QUESTIONS=[];
// Elige un examen del banco: primero las preguntas que esta persona ha visto menos veces, al azar entre empates
function pickExam(seen={},rand=Math.random){
  const ids=[];
  for(const s of ["V","R","L"])for(let lv=1;lv<=6;lv++){
    const pool=BANK.filter(q=>q.s===s&&q.lv===lv).map(q=>({id:q.id,k:(seen[q.id]||0)+rand()}));
    pool.sort((a,b)=>a.k-b.k);
    ids.push(...pool.slice(0,BLUEPRINT[s][lv]).map(x=>x.id));
  }
  return ids;
}

function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
// Orden de opciones fijo por pregunta (siempre igual para todos)
function order(q){const idx=q.o.map((_,i)=>i);let h=hash(q.id);for(let i=idx.length-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const LEVEL_TXT={0:"Principiante",1:"Básico 1",2:"Básico 2",3:"Intermedio 1",4:"Intermedio 2",5:"Avanzado 1",6:"Avanzado 2"};
const TOPIK_TXT={0:"Aún sin nivel TOPIK",1:"Cercano a TOPIK I · nivel 1",2:"Cercano a TOPIK I · nivel 2",3:"Cercano a TOPIK II · nivel 3",4:"Cercano a TOPIK II · nivel 4",5:"Cercano a TOPIK II · nivel 5",6:"Cercano a TOPIK II · nivel 6"};

// answers: {id: índice original elegido}
function grade(answers,qs=QUESTIONS){
  const byLv={},bySec={};let right=0;
  for(const q of qs){
    const ok=answers[q.id]===0;
    (byLv[q.lv]??={n:0,ok:0}).n++; if(ok)byLv[q.lv].ok++;
    (bySec[q.s]??={n:0,ok:0}).n++; if(ok)bySec[q.s].ok++;
    if(ok)right++;
  }
  // Nivel = el más alto L con ≥60% en ese nivel y ≥60% acumulado de 1..L, sin saltar niveles fallados
  let level=0,cn=0,cok=0;
  for(let L=1;L<=6;L++){
    const b=byLv[L];cn+=b.n;cok+=b.ok;
    if(b.ok/b.n>=0.6&&cok/cn>=0.6)level=L;else if(b.ok/b.n<0.4)break;
  }
  return {right,total:qs.length,level,byLv,bySec};
}

function speak(lines,done){
  speechSynthesis.cancel();let k=0;
  const next=()=>{if(k>=lines.length){done&&done();return}

  next();
}

    <div><h2>Fechas y costos del examen real</h2><p>Cambian cada año y por país. Consulta el calendario en el sitio oficial <a href="https://www.topik.go.kr" target="_blank" rel="noopener">topik.go.kr</a> o con la Embajada de Corea. Para dudas, pregunta en la galería <a href="/#g-coreano">Aprender coreano</a>.</p></div>
  </section>
  <section class="sheet guide" id="guia-topik">
    <div class="eyebrow n">Guía del TOPIK</div>
    <h2>Estructura, puntajes y niveles del TOPIK</h2>
    <p>El TOPIK se presenta en dos exámenes separados. Eliges cuál presentar según tu nivel: TOPIK I si estás empezando y TOPIK II si ya tienes una base intermedia. No hay puntaje mínimo por sección: el nivel depende solo de tu puntaje total.</p>
    <div class="tables">
      <div class="tbl"><table>
        <tr><th>TOPIK I</th><th>Preguntas</th><th>Tiempo</th><th>Puntos</th></tr>
        <tr><td>Comprensión auditiva</td><td>30</td><td>40 min</td><td>100</td></tr>
        <tr><td>Lectura</td><td>40</td><td>60 min</td><td>100</td></tr>
        <tr class="tot"><td>Total</td><td>70</td><td>100 min</td><td>200</td></tr>
        <tr><td colspan="4">Nivel 1: desde 80 puntos · Nivel 2: desde 140 puntos</td></tr>
      </table></div>
      <div class="tbl"><table>
        <tr><th>TOPIK II</th><th>Preguntas</th><th>Tiempo</th><th>Puntos</th></tr>
        <tr><td>Comprensión auditiva</td><td>50</td><td>60 min</td><td>100</td></tr>
        <tr><td>Escritura</td><td>4</td><td>50 min</td><td>100</td></tr>
        <tr><td>Lectura</td><td>50</td><td>70 min</td><td>100</td></tr>
        <tr class="tot"><td>Total</td><td>104</td><td>180 min</td><td>300</td></tr>
        <tr><td colspan="4">Nivel 3: 120 · Nivel 4: 150 · Nivel 5: 190 · Nivel 6: 230 puntos</td></tr>
      </table></div>
    </div>
    <p>Si no alcanzas el puntaje mínimo (80 en TOPIK I o 120 en TOPIK II) no se emite certificado. El certificado tiene una vigencia de dos años. Formatos, fechas y costos pueden cambiar cada año: confírmalos en <a href="https://www.topik.go.kr" target="_blank" rel="noopener" style="color:var(--navy);font-weight:600">topik.go.kr</a>.</p>

    <h3>Consejos para la comprensión auditiva</h3>
    <ul>
      <li><strong>Lee las opciones antes del audio.</strong> Así sabes si debes buscar un lugar, una hora, un precio o la opinión de alguien.</li>
      <li><strong>Identifica quién habla y dónde está.</strong> Muchas preguntas de TOPIK I se resuelven al reconocer la situación: una tienda, un banco, una estación o una oficina.</li>
      <li><strong>Practica números coreanos y sino-coreanos.</strong> Las horas (세 시 반), los precios (삼만 오천 원) y las fechas aparecen en casi todos los exámenes.</li>
      <li><strong>No te quedes atorado.</strong> Si una pregunta se te fue, marca tu mejor opción y concéntrate en el siguiente audio.</li>
    </ul>

    <h3>Consejos para la lectura</h3>
    <ul>
      <li><strong>Administra el tiempo.</strong> En TOPIK I tienes unos 90 segundos por pregunta. Las primeras son avisos y mensajes cortos; deja más tiempo para los textos largos del final.</li>
      <li><strong>Lee primero la pregunta.</strong> Después busca en el texto solo la parte que la responde, en lugar de traducir palabra por palabra.</li>
      <li><strong>Fíjate en los conectores.</strong> 그래서 (por eso), 그런데 (pero / por cierto), 하지만 (sin embargo) y 그러므로 (por lo tanto) indican el orden de las oraciones y la idea principal.</li>
    </ul>

    <h3>Escritura en TOPIK II</h3>
    <p>La sección de escritura tiene cuatro preguntas: dos de completar oraciones (51 y 52), una descripción de una gráfica o datos de 200 a 300 caracteres (53) y un ensayo de opinión de 600 a 700 caracteres (54). Usa el estilo escrito en -다 (예: 증가했다, 필요하다) y no el estilo conversacional en -요.</p>

    <h3>Errores frecuentes de los hispanohablantes</h3>
    <div class="err">
      <div><b>은/는 frente a 이/가</b><p>El español no tiene marcador de tema. 은/는 presenta el tema o marca contraste; 이/가 señala el sujeto o la información nueva que se pregunta.</p><span class="ex">누가 왔어요? → 민수가 왔어요. (<s>민수는</s>)</span></div>
      <div><b>에 frente a 에서</b><p>Los dos se traducen como «en». 에 indica dónde está algo o hacia dónde vas; 에서 indica dónde ocurre una acción.</p><span class="ex">집에 있어요. / 집에서 공부해요.</span></div>
      <div><b>Adjetivos que se conjugan como verbos</b><p>En coreano los adjetivos se conjugan solos; no se usa 이다 («ser») con ellos.</p><span class="ex">이 가방은 예뻐요. (<s>예쁘입니다</s>)</span></div>
      <div><b>El verbo va al final</b><p>El orden básico es sujeto, objeto y verbo. Las partículas, y no la posición, dicen quién hace qué.</p><span class="ex">저는 커피를 마셔요. (yo · café · bebo)</span></div>
      <div><b>Niveles de cortesía</b><p>No basta con tú y usted: está el formal (-ㅂ니다), el cortés (-아요/어요) y el informal (-아/어). En el examen predominan el formal y el cortés.</p><span class="ex">감사합니다 · 고마워요 · 고마워</span></div>
      <div><b>Consonantes que en español suenan igual</b><p>El coreano distingue consonantes simples, aspiradas y tensas. Practica pares como estos para no confundirlas al escuchar.</p><span class="ex">불 (fuego) · 풀 (pasto) · 뿔 (cuerno)</span></div>
    </div>
  </section>
  ${ad("infeed")}
  <section class="sheet faq">
    <div class="eyebrow n">Preguntas frecuentes</div>
    <details><summary>¿La prueba es gratis?</summary><p>Sí. Es gratis y no necesitas crear una cuenta.</p></details>
    <details><summary>¿Es el examen TOPIK oficial?</summary><p>No. Es una prueba de práctica con preguntas originales al estilo TOPIK. El certificado oficial solo lo da el TOPIK, organizado por el NIIED de Corea.</p></details>
    <details><summary>¿Qué nivel de TOPIK necesito para la Beca GKS?</summary><p>No se exige para aplicar a la mayoría de los programas, pero un certificado vigente suma puntos. Revisa la convocatoria de cada año.</p></details>
    <details><summary>¿Cuántos niveles tiene el TOPIK?</summary><p>Seis: TOPIK I cubre los niveles 1 y 2, y TOPIK II los niveles 3 a 6.</p></details>
  </section>
  ${ad("bottom")}`;
  $("#start").onclick=()=>{st=fresh();const seen=loadSeen();st.qids=pickExam(seen);st.qids.forEach(id=>seen[id]=(seen[id]||0)+1);saveSeen(seen);st.ends=Date.now()+EXAM_MIN*60000;save();go("V")};
  if(resume)$("#resume").onclick=()=>go(st.last||"V");
}

/* ---------- Sección del examen ---------- */
let sec="V",askSubmit=false;
const secQs=s=>QUESTIONS.map((q,n)=>({q,n})).filter(x=>x.q.s===s);
function vSeccion(s){
  sec=s;st.last=s;save();
  const n=ORDER.indexOf(s)+1;
  document.title=`Sección ${n}: ${SECTIONS[s]} · Examen de coreano | GaleríaK`;
  $("#crumb").textContent=`Sección ${n} de 3 · ${SECTIONS[s]}`;
  page.innerHTML=`<div class="exam"><section class="sheet q" id="q"></section>
    <aside class="side"><div class="sheet card" id="omr"></div>${ad("side","tall")}</aside></div>${ad("examBottom")}`;
  startTimer();renderQ();
}
function renderQ(){
  const list=secQs(sec),k=Math.min(st.i[sec]||0,list.length-1),{q,n}=list[k];
  const ord=order(q),plays=st.plays[q.id]||0,secDone=list.filter(x=>st.ans[x.q.id]!==undefined).length;
  const last=k===list.length-1;
  $("#q").innerHTML=`
    <div class="prog" aria-label="Avance de la sección"><div style="width:${secDone/list.length*100}%"></div></div>
    <div class="qhead"><span class="qnum">${n+1}</span><span class="chip sec">${SECTIONS[q.s]}</span><span class="chip">${k+1} de ${list.length} en esta sección</span></div>
    <p class="prompt">${esc(q.p)}</p>
    ${q.t?`<div class="passage">${fill(q.t)}</div>`:""}
    ${q.a?`<div class="listen"><button class="btn" id="play" ${plays>=2||!koVoice?"disabled":""}>▶ Escuchar</button>
      <span class="left">${koVoice?`Reproducciones: ${plays}/2`:"Tu navegador no tiene voz en coreano."}</span></div>
      ${!koVoice?`<div class="script">${scriptOf(q)}</div><p class="note">Mostramos el texto del audio. Cuenta igual, pero es más fácil que en el examen real.</p>`:""}`:""}
    <div class="opts" role="radiogroup">
      ${ord.map((oi,j)=>`<label class="opt ${st.ans[q.id]===oi?"sel":""}"><input type="radio" name="o" id="o${j}" value="${oi}" ${st.ans[q.id]===oi?"checked":""}>
        <span class="bub">${j+1}</span><span class="t ${q.ko?"ko":""}">${esc(q.o[oi])}</span></label>`).join("")}
    </div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${k===0?"disabled":""}>← Anterior</button>
      <button class="btn ghost flagb" id="flag">${st.flag[q.id]?"Quitar marca":"Marcar para revisar"}</button>
      ${last?(sec==="L"?`<button class="btn red" id="endsec">Terminar prueba</button>`:`<button class="btn red" id="endsec">Terminar sección →</button>`):`<button class="btn" id="next">Siguiente →</button>`}
    </div>`;
  const done=Object.keys(st.ans).length;
  $("#omr").innerHTML=`<h3>Hoja de respuestas</h3>
    ${ORDER.map(s=>`<div style="display:flex;flex-direction:column;gap:6px"><span class="note">${SECTIONS[s]}</span><div class="grid">
      ${secQs(s).map((x,j)=>`<button class="cell ${st.ans[x.q.id]!==undefined?"done":""} ${x.n===n?"cur":""} ${st.flag[x.q.id]?"flag":""}" data-s="${s}" data-j="${j}" aria-label="Pregunta ${x.n+1}">${x.n+1}</button>`).join("")}
    </div></div>`).join("")}
    <div class="legend"><span><i class="d"></i>Respondida</span><span><i></i>Pendiente</span><span><i class="f"></i>Marcada</span></div>
    ${askSubmit?`<div class="confirm"><b>¿Entregar la prueba?</b><span>${EXAM_N-done?`Te faltan ${EXAM_N-done} preguntas; contarán como incorrectas.`:"Respondiste todas las preguntas."}</span>
      <div><button class="btn red" id="yes">Sí, entregar</button><button class="btn ghost" id="no">Seguir</button></div></div>`
      :`<span class="note" style="font-variant-numeric:tabular-nums">${done} de ${EXAM_N} respondidas</span><button class="btn ghost" id="sub">Entregar prueba</button>`}`;
  document.querySelectorAll("input[name=o]").forEach(r=>r.onchange=()=>{st.ans[q.id]=+r.value;save();renderQ()});
  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{const s=b.dataset.s;st.i[s]=+b.dataset.j;askSubmit=false;if(s===sec){save();renderQ();scrollTo({top:0})}else go(s)});
  $("#prev").onclick=()=>{st.i[sec]=k-1;save();renderQ();scrollTo({top:0})};
  if($("#next"))$("#next").onclick=()=>{st.i[sec]=k+1;save();renderQ();scrollTo({top:0})};
  if($("#endsec"))$("#endsec").onclick=()=>{if(sec==="L"){askSubmit=true;renderQ();$("#omr").scrollIntoView({block:"center"})}else go("pausa-"+sec)};
  $("#flag").onclick=()=>{st.flag[q.id]=!st.flag[q.id];save();renderQ()};
  if($("#sub"))$("#sub").onclick=()=>{askSubmit=true;renderQ()};
  if($("#yes"))$("#yes").onclick=finish;
  if($("#no"))$("#no").onclick=()=>{askSubmit=false;renderQ()};
  if($("#play"))$("#play").onclick=()=>{st.plays[q.id]=plays+1;save();const b=$("#play");b.disabled=true;b.textContent="Reproduciendo…";speak(q.a,()=>renderQ())};
}

/* ---------- Pausa entre secciones ---------- */
function vPausa(s){
  const n=ORDER.indexOf(s),nx=ORDER[n+1],list=secQs(s),ans=list.filter(x=>st.ans[x.q.id]!==undefined).length;
  document.title=`Sección ${n+1} completada · Examen de coreano | GaleríaK`;
  $("#crumb").textContent=`Sección ${n+1} completada`;
  page.innerHTML=`<section class="sheet pause">
    <div class="eyebrow">Sección ${n+1} de 3 completada</div>
    <h1>Terminaste ${SECTIONS[s].toLowerCase()}</h1>
    <div class="track3">${ORDER.map((x,j)=>`<div class="${j<=n?"done":j===n+1?"next":""}">${j+1}. ${SECTIONS[x]}</div>`).join("")}</div>
    <p style="margin:0">Respondiste <b>${ans} de ${list.length}</b> preguntas de esta sección. Tiempo restante: <b id="pauseLeft" style="font-variant-numeric:tabular-nums">--:--</b></p>
    <div class="tip"><b>Siguiente: ${SECTIONS[nx]}</b> (${secQs(nx).length} preguntas). ${SEC_TIP[nx]}</div>
    <div class="row"><button class="btn red" id="cont">Continuar con ${SECTIONS[nx].toLowerCase()} →</button>${ans<list.length?`<button class="btn ghost" id="back">Revisar sección ${n+1}</button>`:""}</div>
  </section>${ad("pause")}`;
  startTimer();
  $("#cont").onclick=()=>go(nx);
  if($("#back"))$("#back").onclick=()=>{const j=list.findIndex(x=>st.ans[x.q.id]===undefined);st.i[s]=j<0?0:j;go(s)};
}

/* ---------- Resultado ---------- */
function vResultado(){
  const r=st.result;
  if(!r){go("inicio");return}
  $("#timer").hidden=true;
  document.title=`Mi nivel de coreano: ${r.level} de 6 · GaleríaK`;
  $("#crumb").textContent="Resultado";
  const pct=k=>Math.round(r.bySec[k].ok/r.bySec[k].n*100);
  const weak=ORDER.slice().sort((a,b)=>pct(a)-pct(b))[0];
  const tips={V:"Repasa terminaciones y partículas del nivel siguiente con frases cortas de ejemplo.",R:"Lee textos breves cada día (avisos, mensajes, noticias fáciles) y busca primero la idea principal.",L:"Escucha diálogos cortos: primero sin texto, luego con texto, y repite en voz alta."};
  const items=QUESTIONS.map((q,n)=>({q,n,ok:st.ans[q.id]===0,mine:st.ans[q.id]}));
  const sorted=[...items.filter(x=>!x.ok),...items.filter(x=>x.ok)];
  const rv=({q,n,ok,mine})=>`<div class="rv ${ok?"ok":"bad"}">
    <div class="h"><span class="tag ${ok?"ok":"bad"}">${ok?"Correcta":(mine===undefined?"Sin responder":"Incorrecta")}</span><span>Pregunta ${n+1} · ${SECTIONS[q.s]} · Nivel ${q.lv}</span></div>
    ${q.t?`<div class="ko" style="font-size:16px">${fill(q.t.length>90?q.t.slice(0,90)+"…":q.t)}</div>`:`<div class="script">${scriptOf(q)}</div>`}
    <p><b>Respuesta:</b> <span class="${q.ko?"ko":""}">${esc(q.o[0])}</span>${!ok&&mine!==undefined?` · <span style="color:var(--bad)">Tu respuesta: <span class="${q.ko?"ko":""}">${esc(q.o[mine])}</span></span>`:""}</p>
    <p class="note">${esc(q.e)}</p></div>`;
  page.innerHTML=`
  <div class="res-top">
    <section class="sheet big">
      <div class="eyebrow">Tu nivel estimado</div>
      <div class="n">${r.level}<small> / 6</small></div>
      <h2>${LEVEL_TXT[r.level]}</h2>
      <span class="note">${TOPIK_TXT[r.level]}</span>
      <div class="scale">${[1,2,3,4,5,6].map(l=>`<div class="${l<=r.level?"on":""}"></div>`).join("")}</div>
      <span class="note" style="font-variant-numeric:tabular-nums">${r.right} de ${r.total} correctas</span>
      <div class="row"><button class="btn red" id="share">Compartir mi resultado</button><span class="toast" id="toast" role="status"></span></div>
    </section>
    <section class="sheet secs">
      <div class="eyebrow n">Resultado por sección</div>
      ${ORDER.map(k=>`<div class="srow"><span>${SECTIONS[k]}</span><div class="trk"><div style="width:${pct(k)}%"></div></div><b>${pct(k)}%</b></div>`).join("")}
      <div style="overflow-x:auto"><table class="lvtable"><tr><th>Nivel de pregunta</th>${[1,2,3,4,5,6].map(l=>`<th>${l}</th>`).join("")}</tr>
        <tr><td>Correctas</td>${[1,2,3,4,5,6].map(l=>`<td>${r.byLv[l].ok}/${r.byLv[l].n}</td>`).join("")}</tr></table></div>
    </section>
  </div>
  ${ad("result")}
  <div>
    <section class="sheet box">
      <div class="eyebrow n">Qué repasar</div>
      <ul>
        <li><b>${SECTIONS[weak]}</b> es tu sección más baja (${pct(weak)}%). ${tips[weak]}</li>
        <li>${r.level<6?`Para subir al nivel ${r.level+1}, revisa abajo las preguntas de nivel ${r.level+1} que fallaste.`:"Dominas todos los niveles de esta prueba. El siguiente paso es practicar con exámenes TOPIK II completos."}</li>
      </ul>
      <div class="row"><button class="btn" id="again">Hacer la prueba otra vez</button><a class="btn ghost" href="/#g-coreano">Galería Aprender coreano</a></div>
    </section>
  </div>
  <section class="sheet review">
    <div class="eyebrow n">Revisión con explicaciones · primero las incorrectas</div>
    ${sorted.map((x,j)=>rv(x)+((j+1)%10===0&&j<sorted.length-1?ad("review"):"")).join("")}
  </section>
  ${ad("resultBottom")}`;
  $("#again").onclick=()=>{st=fresh();save();go("inicio")};
  $("#share").onclick=async()=>{
    const url=location.origin+location.pathname,text=`Saqué nivel ${r.level} de 6 en la prueba de coreano gratis de GaleríaK. ¿Y tú?`;
    try{if(navigator.share){await navigator.share({title:"Prueba de nivel de coreano",text,url});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(text+" "+url);$("#toast").textContent="Enlace copiado"}catch(e){$("#toast").textContent=url}
  };
}

function boot(){
  QUESTIONS=st.qids.map(id=>BYID[id]);
  clearInterval(tick);$("#timer").hidden=true;askSubmit=false;
  if(inProgress()&&left()<=0){st.result=grade(st.ans);save();if(STORE&&P!=="resultado"){go("resultado");return}P="resultado"}
  if(ORDER.includes(P)){if(!inProgress()){P="inicio";vInicio()}else vSeccion(P)}
  else if(/^pausa-[VR]$/.test(P)){if(!inProgress())vInicio();else vPausa(P.slice(6))}
  else if(P==="resultado")vResultado();
  else vInicio();
  fillAds();
}
boot();
